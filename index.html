<!DOCTYPE html>

<head>

<style>
  :root{
    --pitch:#19194B;--pitch-2:#101038;--ink:#141822;--mut:#6b727d;
    --line:#e6eae8;--bg:#f3f6f4;--card:#fff;
    --gold:#f4b400;--silver:#aab2ad;--bronze:#cd7f32;--green:#2d52c8;
    --accent:#19194B;--accent-d:#101038;
    --shadow:0 1px 2px rgba(0,0,0,.04),0 10px 30px rgba(16,16,48,.10);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .num{font-variant-numeric:tabular-nums}
  header{background:linear-gradient(160deg,var(--pitch),var(--pitch-2));color:#fff;padding:18px 16px 0}
  .wrap{max-width:680px;margin:0 auto}
  .hero{display:flex;align-items:center;gap:14px;padding-bottom:14px}
  .logo img{height:46px;width:auto;display:block;border-radius:8px}
  .badge{height:46px;min-width:46px;padding:0 12px;border-radius:12px;background:var(--gold);color:#1a1a1a;
    font-family:"Anton",sans-serif;font-size:22px;letter-spacing:1px;display:flex;align-items:center;justify-content:center}
  .htext .title{font-family:"Anton",sans-serif;font-size:26px;line-height:1;letter-spacing:.5px}
  .htext .sub{font-size:12.5px;opacity:.85;margin-top:4px;font-weight:500}
  nav{display:flex;gap:2px;max-width:680px;margin:0 auto;overflow-x:auto;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav button{flex:1 0 auto;white-space:nowrap;background:none;border:0;color:rgba(255,255,255,.7);font:inherit;font-weight:700;font-size:13.5px;padding:12px 14px;cursor:pointer;border-bottom:3px solid transparent}
  nav button.on{color:#fff;border-bottom-color:var(--gold)}
  main{max-width:680px;margin:0 auto;padding:16px 16px 70px}
  .me{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:16px;box-shadow:var(--shadow)}
  .me label{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
  .me .row{display:flex;gap:8px;margin-top:8px;align-items:center}
  input,select{font:inherit}
  .me input[type=text]{flex:1;border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:15px}
  .me .who{font-size:15px}.me .who b{color:var(--accent)}
  .btn{background:var(--accent);color:#fff;border:0;border-radius:9px;padding:10px 16px;font:inherit;font-weight:700;font-size:14px;cursor:pointer}
  .btn:hover{background:var(--accent-d)}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn.gold{background:var(--gold);color:#1a1a1a}
  .btn.sm{padding:7px 12px;font-size:13px}
  .day{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;margin:18px 4px 8px}
  .match,.bonus{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
  .match .meta{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin-bottom:8px;font-weight:500}
  .match .grp{background:var(--bg);border-radius:5px;padding:1px 7px;font-weight:700}
  .teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
  .team{display:flex;align-items:center;gap:8px;min-width:0}
  .team.away{flex-direction:row-reverse;text-align:right}
  .flag{width:28px;height:21px;object-fit:cover;border-radius:3px;box-shadow:0 0 0 1px rgba(0,0,0,.1);display:block;flex:0 0 auto}
  .flag-emoji{font-size:22px}
  .tname{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .score{display:flex;align-items:center;gap:6px}
  .score input{width:42px;height:42px;text-align:center;font-size:18px;font-weight:700;border:1.5px solid var(--line);border-radius:10px;-moz-appearance:textfield}
  .score input::-webkit-outer-spin-button,.score input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .score input:focus{outline:none;border-color:var(--accent)}
  .score input:disabled{background:var(--bg);color:var(--mut)}
  .sep{color:var(--mut);font-weight:700}
  .result{display:flex;flex-direction:column;align-items:center;gap:2px}
  .result .final{font-size:20px;font-weight:800}
  .result .lbl{font-size:9px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
  .pts{margin-top:8px;font-size:13px;display:flex;justify-content:space-between;align-items:center;border-top:1px dashed var(--line);padding-top:8px;color:var(--mut)}
  .pts b{color:var(--ink)}
  .pill{background:var(--green);color:#fff;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:700}
  .pill.zero{background:#e6eae8;color:var(--mut)}
  .locked{font-size:11px;color:var(--mut);font-style:italic}
  .bonus .q{font-size:15px;font-weight:700;margin-bottom:10px;line-height:1.35}
  .bonus .meta{font-size:11px;color:var(--mut);font-weight:600;display:flex;justify-content:space-between;margin-bottom:8px}
  .bonus input[type=text],.bonus input[type=number],.bonus select{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:15px}
  .bonus input:disabled,.bonus select:disabled{background:var(--bg);color:var(--mut)}
  .correct{margin-top:8px;font-size:13px;color:var(--mut);border-top:1px dashed var(--line);padding-top:8px;display:flex;justify-content:space-between;align-items:center}
  .correct b{color:var(--ink)}
  .tag{display:inline-block;background:var(--bg);border-radius:6px;padding:1px 8px;font-size:11px;font-weight:700;color:var(--mut);margin-left:6px}
  .podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin:6px 0 16px}
  .pod{flex:1;max-width:150px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center;box-shadow:var(--shadow)}
  .pod .medal{font-size:26px}
  .pod .pname{font-weight:800;font-size:14px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pod .ppts{font-size:13px;color:var(--mut);font-weight:700}
  .pod.first{transform:translateY(-10px);border-color:var(--gold);box-shadow:0 10px 30px rgba(244,180,0,.25)}
  table.rank-table{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:0;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
  table.rank-table col.col-rank{width:58px}
  table.rank-table col.col-player{width:auto}
  table.rank-table col.col-hit{width:92px}
  table.rank-table col.col-bonus{width:110px}
  table.rank-table col.col-total{width:110px}
  table.rank-table th,table.rank-table td{padding:16px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
  table.rank-table th{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--mut);background:#fafbfb;font-weight:800}
  table.rank-table tr:last-child td{border-bottom:0}
  table.rank-table th.rank-h,table.rank-table td.rank{text-align:left}
  table.rank-table th.player-h,table.rank-table td.player{text-align:left}
  table.rank-table th.stat-h,table.rank-table td.stat,table.rank-table th.total-h,table.rank-table td.total{text-align:right}
  table.rank-table td.rank{font-weight:800;font-size:17px}
  table.rank-table td.player{font-size:17px;font-weight:700}
  table.rank-table td.stat{font-size:17px;font-variant-numeric:tabular-nums}
  table.rank-table td.total{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
  .me-row{background:#eef1fb}
  .rank.p1{color:var(--gold)} .rank.p2{color:var(--silver)} .rank.p3{color:var(--bronze)}
  .you-tag{color:var(--accent);font-size:12px;font-weight:800;margin-left:6px;white-space:nowrap}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:var(--shadow)}
  .panel h3{margin:0 0 12px;font-size:15px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .field{margin-bottom:8px}
  .field label{display:block;font-size:11px;font-weight:700;color:var(--mut);margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px}
  .field input,.field select{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 10px;font-size:14px}
  .rules{font-size:13px;line-height:1.7;color:var(--mut)} .rules b{color:var(--ink)}
  .adminmatch{display:flex;align-items:center;gap:6px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;flex-wrap:wrap}
  .adminmatch .nm{flex:1;min-width:150px}
  .adminmatch input,.adminbq input{width:46px;text-align:center;border:1px solid var(--line);border-radius:6px;padding:6px 4px;font-size:14px;font-weight:700}
  .adminbq{padding:11px 0;border-bottom:1px solid var(--line);font-size:13px}
  .adminbq .qx{font-weight:700;margin-bottom:6px}
  .adminbq .ctrl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .adminbq input[type=text]{width:auto;flex:1;min-width:120px;text-align:left;font-weight:500}
  .empty{text-align:center;color:var(--mut);padding:40px 16px;font-size:14px;line-height:1.5}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:30px;font-size:14px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.25);opacity:0;transition:.25s;pointer-events:none;z-index:99}
  .toast.show{opacity:1;bottom:30px}
  .hint{font-size:12px;color:var(--mut);margin:4px 4px 14px;line-height:1.5}
  .opsline{background:linear-gradient(135deg,#fffdf5,#f7f3e8);border:1px solid #eee2bd;border-radius:12px;padding:11px 14px;margin:0 0 12px;box-shadow:var(--shadow);font-size:13.5px;font-weight:700;color:#6a4b00;line-height:1.45}
  .opsline .label{display:inline-block;margin-right:8px;font-size:11px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:#8a6a10}
  .loading{text-align:center;padding:50px;color:var(--mut)}
  .round-nav{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .round-nav::-webkit-scrollbar{display:none}
  .round-nav button{flex:0 0 auto;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 14px;font:inherit;font-size:13px;font-weight:700;color:var(--mut);cursor:pointer;white-space:nowrap}
  .round-nav button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .round-nav button .rdot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle}
  .all-picks{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px;display:flex;flex-wrap:wrap;gap:5px}
  .pick-chip{font-size:12px;font-weight:700;background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:3px 10px;color:var(--mut);white-space:nowrap}
  .pick-chip.exact{background:#e3e9fc;border-color:#aebef0;color:#1b2e7a}
  .pick-chip.good{background:#fef9c3;border-color:#fde047;color:#854d0e}
  .pick-chip.me{border-color:var(--accent);color:var(--accent)}
  .reveal-toggle{font-size:11px;font-weight:700;color:var(--mut);cursor:pointer;margin-top:8px;display:inline-block;border:0;background:none;padding:0}
  .reveal-toggle:hover{color:var(--ink)}
  .prizehero{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,#fff,#fff7e6);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow);margin-bottom:16px}
  .prizehero img{width:120px;height:auto;border-radius:12px;object-fit:cover;box-shadow:0 4px 14px rgba(0,0,0,.12)}
  .ph-title{font-family:"Anton",sans-serif;font-size:23px;line-height:1}
  .ph-sub{font-size:13px;color:var(--mut);margin-top:6px;line-height:1.45}
  .prize{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);margin-bottom:10px}
  .prize .pmedal{font-size:32px;line-height:1}
  .prize .pinfo{flex:1}
  .prize .pplace{font-weight:800;font-size:15px}
  .prize .pwin{color:var(--mut);font-size:14px;font-weight:600;margin-top:2px}
  .prize .pcount{font-size:20px;letter-spacing:2px}
  .prize.gold{border-color:var(--gold);box-shadow:0 8px 26px rgba(244,180,0,.2)}
  .rcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
  .rcard h3{margin:0 0 4px;font-size:17px;font-family:"Anton",sans-serif;letter-spacing:.3px}
  .rcard .lead{color:var(--mut);font-size:13px;margin-bottom:12px;line-height:1.5}
  .rrow{display:flex;align-items:flex-start;gap:10px;padding:7px 0;font-size:14px;line-height:1.45;border-bottom:1px dashed var(--line)}
  .rrow:last-child{border-bottom:0}
  .rrow .pp{flex:0 0 auto;min-width:54px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
  .rrow.ko .pp{color:#b8860b}
  .rmax{margin-top:8px;font-size:13px;font-weight:700;background:var(--bg);border-radius:8px;padding:8px 10px}
  .fineprint{font-size:13.5px;line-height:1.6;color:var(--ink)}
  .fineprint li{margin-bottom:8px}
  .fineprint b{color:var(--accent)}
  .livebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 12px}
  .livechip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 11px;font-size:12px;font-weight:700;color:var(--mut)}
  .dot{width:8px;height:8px;border-radius:50%;background:#22c55e;display:inline-block}
  .cd-chip{display:inline-block;background:#eef1fb;color:var(--accent);border:1px solid #d7ddf5;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:800;letter-spacing:.2px;white-space:nowrap}
  .tailopt{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:5px;cursor:pointer;line-height:0;display:inline-flex}
  .tailopt.sel{border-color:var(--accent);box-shadow:0 0 0 2px rgba(25,25,75,.18)}
    /* Schwebender Cabin-Log-Button unten rechts (Lufthansa Blau) */
  .cabin-log-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #002F6C; /* Exaktes Lufthansa-Blau */
    color: #ffffff; /* Weisser Text */
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 30px;
    padding: 10px 18px;
    font-weight: 700;
    font-size: 13.5px;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    z-index: 1000;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: transform 0.2s, background-color 0.2s;
  }
  .cabin-log-btn:hover {
    background: #00204a; /* Etwas dunkleres Blau beim Drüberfahren */
    transform: scale(1.05);
  }

  /* Kleines Feedback-Popup-Fenster direkt über dem Button */
  .cabin-log-popup {
    display: none; /* Am Anfang unsichtbar */
    position: fixed;
    bottom: 70px;
    right: 20px;
    width: 300px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    box-shadow: 0 10px 30px rgba(16,16,48,0.2);
    z-index: 1000;
  }
  .cabin-log-popup h4 {
    margin: 0 0 8px;
    font-size: 14px;
    font-weight: 700;
  }
  .cabin-log-popup textarea {
    width: 100%;
    min-height: 80px;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px;
    font: inherit;
    font-size: 13px;
    resize: none;
  }
  .cabin-log-popup textarea:focus {
    outline: none;
    border-color: #002F6C;
  }
  .cabin-log-popup .actions {
    display: flex;
    justify-content: flex-end;
    gap: 6px;
    margin-top: 8px;
  }

</style>

  const visible=tipRound==="Knockout"?koMatches:matches.filter(m=>m.round===tipRound); 
  const fallback=!hasRounds?matches:visible; 

  // --- HIER IST DIE EINZIGE KORREKTUR ---
  const pickedInRound = fallback.filter(m => {const p = myPick(m.id); return p && p.home_tip != null;}).length;
  const totalInRound = fallback.length; 

  const chips=[]; 
  if(totalInRound > 0) {
    chips.push(`<span class="livechip">📝 ${pickedInRound}/${totalInRound} picks this round</span>`); 
  }
  // --- ENDE DER KORREKTUR ---

  const statusBar=chips.length?`<div class="livebar">${chips.join("")}</div>`:""; 
  const days=[]; 
  fallback.forEach(m=>{ 
    let d=days.find(x=>x.date===m.match_date); 
    if(!d){d={date:m.match_date,ms:[]};days.push(d);} 
    d.ms.push(m); 
  }); 
  
  let html=""; 
  days.forEach(d=>{ 
    html+=`<div class="day">${esc(d.date)}</div>`; 
    d.ms.forEach(m=>{html+=matchCard(m);}); 
    if(d.ms.some(m=>!isClosed(m))) {
      html+=`<button class="btn js-savetips" style="width:100%;padding:13px;margin:4px 0 18px">Save predictions</button>`; 
    }
  }); 
  
  return (hasRounds?nav:"")+renderOpsLine()+statusBar+html; 
}

      await loadAll();
    });
    document.querySelectorAll('[data-lock]').forEach(btn=>btn.onclick=async()=>{
      const id=+btn.dataset.lock, m=matches.find(x=>x.id===id);
      await sb.from("matches").update({locked:!m.locked}).eq("id",id);
      await loadAll();
    });
    document.querySelectorAll('[data-del]').forEach(btn=>btn.onclick=async()=>{
      if(!confirm("Delete match?"))return;
      await sb.from("matches").delete().eq("id",+btn.dataset.del);
      await loadAll();
    });
    const ab=document.getElementById("addBonus");
    if(ab) ab.onclick=async()=>{
      const q=document.getElementById("bq").value.trim();
      if(!q){toast("Enter a question");return;}
      const type=document.getElementById("bt").value;
      const pts=+document.getElementById("bp").value||5;
      let options=null;
      if(type==="choice"){
        const arr=document.getElementById("bo").value.split(",").map(s=>s.trim()).filter(Boolean);
        if(arr.length<2){toast("Choice needs ≥2 options");return;}
        options=JSON.stringify(arr);
      }
      const order=(bonusQs.reduce((mx,x)=>Math.max(mx,x.sort_order||0),0))+1;
      const {error}=await sb.from("bonus_questions").insert([{question:q,qtype:type,options,points:pts,sort_order:order}]);
      if(error){toast("Error");return;}
      await loadAll();toast("Bonus question added");
    };
    document.querySelectorAll('[data-bres]').forEach(btn=>btn.onclick=async()=>{
      const id=+btn.dataset.bres, q=bonusQs.find(x=>x.id===id), row=btn.closest('[data-aq]');
      if(!q.resolved){
        const v=String(row.querySelector('[data-bc]').value).trim();
        if(v===""){toast("Enter the correct answer");return;}
        await sb.from("bonus_questions").update({correct:v,resolved:true,locked:true}).eq("id",id);
      } else {
        await sb.from("bonus_questions").update({resolved:false}).eq("id",id);
      }
      await loadAll();
    });
    document.querySelectorAll('[data-block]').forEach(btn=>btn.onclick=async()=>{
      const id=+btn.dataset.block, q=bonusQs.find(x=>x.id===id);
      await sb.from("bonus_questions").update({locked:!q.locked}).eq("id",id);
      await loadAll();
    });
    document.querySelectorAll('[data-bdel]').forEach(btn=>btn.onclick=async()=>{
      if(!confirm("Delete bonus question?"))return;
      await sb.from("bonus_questions").delete().eq("id",+btn.dataset.bdel);
      await loadAll();
    });
    const buildManifest=()=>{ const t=totals(); const lines=["Rank,Player,Hits,Bonus,Total"]; t.forEach((p,i)=>lines.push(`${i+1},"${String(p.name).replace(/"/g,'""')}",${p.exact},${p.bonus},${p.pts}`)); return lines.join("\n"); };
    const gm=document.getElementById("genManifest");
    if(gm) gm.onclick=()=>{ const out=document.getElementById("manifestOut"); out.value=buildManifest(); toast("Manifest generated"); };
    const dm=document.getElementById("dlManifest");
    if(dm) dm.onclick=()=>{ const csv=buildManifest(); const blob=new Blob([csv],{type:"text/csv"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`opsd-flight-deck-${todayKey()}.csv`; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(a.href); };
  }
}

// Öffnet und schliesst das Feedback-Popup
function toggleCabinLog() {
  const modal = document.getElementById("cabinLogModal");
  if (modal.style.display === "block") {
    modal.style.display = "none";
  } else {
    modal.style.display = "block";
    document.getElementById("cabinLogText").value = "";
    document.getElementById("cabinLogText").focus();
  }
}

// Sendet die Nachricht anonym an Supabase
async function sendCabinLog() {
  const txt = document.getElementById("cabinLogText").value.trim();
  if (!txt) {
    toast("Please enter a message.");
    return;
  }
  
  // Sendet den Text an deine neue Supabase-Tabelle "feedback"
  const { error } = await sb.from("feedback").insert([{ message: txt }]);
  
  if (error) {
    toast("Could not submit log entry. Sorry!");
  } else {
    toast("Log entry submitted! Thank you 🙏");
    document.getElementById("cabinLogModal").style.display = "none";
  }
}
// Reagiert auf Zurück/Vorwärts im Browser
window.addEventListener("hashchange", () => {
  const h = window.location.hash.replace("#", "");
  if (validTabs.includes(h) && tab !== h) {
    tab = h;
    renderView();
  }
});

loadAll(); // <-- Diese Zeile ist schon da

loadAll();
setInterval(tickCountdowns, 30000);
</script>
<!-- Schwebender Button (Immer sichtbar) -->
<button class="cabin-log-btn" onclick="toggleCabinLog()">
  ✈️ Cabin Log
</button>

<!-- Popup-Fenster (öffnet sich bei Klick) -->
<div class="cabin-log-popup" id="cabinLogModal">
  <h4>✈️ Cabin Log Entry</h4>
  <div style="font-size:12px; color:var(--mut); margin-bottom:8px; line-height:1.4;">
    Spotted a bug or have an idea? Log it here anonymously. Thanks
  </div>
  <textarea id="cabinLogText" placeholder="Your message to the flight deck..."></textarea>
  <div class="actions">
    <button class="btn ghost sm" onclick="toggleCabinLog()">Cancel</button>
    <button class="btn sm" onclick="sendCabinLog()">Submit</button>
  </div>
</div>
