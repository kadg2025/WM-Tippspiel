function scoreOf(pick,m){ if(!pick||!m||!m.finished||m.home_score==null||m.away_score==null) return null; const ph=+pick.home_tip,pa=+pick.away_tip,rh=+m.home_score,ra=+m.away_score; const S=(m.phase==="Group")?SCORE.group:SCORE.knockout; let pts=0; if(Math.sign(ph-pa)===Math.sign(rh-ra)) pts+=S.tendency; if(ph===rh) pts+=S.home; if(pa===ra) pts+=S.away; if(ph-pa===rh-ra) pts+=S.diff; return pts; }
function isExactHit(pick,m){ return pick&&m&&m.finished&&+pick.home_tip===+m.home_score&&+pick.away_tip===+m.away_score; }
function maxPts(m){ const S=(m.phase==="Group")?SCORE.group:SCORE.knockout; return S.tendency+S.home+S.away+S.diff; }
function isClosed(m){ if(m.finished||m.locked) return true; if(m.kickoff){ const k=new Date(m.kickoff).getTime(); if(!isNaN(k)&&Date.now()>=k-5*60*1000) return true; } return false; }
function statusBanner(m){ if(m.finished) return `<div class="hint" style="margin:8px 0 0">✅ Final score confirmed</div>`; if(!m.kickoff) return ""; const ms=new Date(m.kickoff).getTime()-Date.now(); if(isNaN(ms)) return ""; const min=Math.floor(ms/60000); if(min<0) return `<div class="hint" style="margin:8px 0 0;color:#b45309;font-weight:700">🛑 Gate closed</div>`; if(min<=15) return `<div class="hint" style="margin:8px 0 0;color:#b45309;font-weight:700">⏳ Gate closes in ${min} min</div>`; if(min<=60) return `<div class="hint" style="margin:8px 0 0;color:var(--accent);font-weight:700">🛫 Boarding soon</div>`; return ""; }
function myPick(id){ return tips.find(x=>x.player===me&&x.match_id===id); }
function bonusEarned(q,player){ if(!q.resolved||q.correct==null||q.correct==="") return null; const a=bonusAnswers.find(x=>x.question_id===q.id&&x.player===player); if(!a) return 0; if(q.qtype==="number"){ const target=parseFloat(q.correct); const diffs=bonusAnswers.filter(x=>x.question_id===q.id).map(x=>{const n=parseFloat(x.answer);return isNaN(n)?Infinity:Math.abs(n-target);}); const best=Math.min(...diffs); const mine=parseFloat(a.answer), myd=isNaN(mine)?Infinity:Math.abs(mine-target); return (myd===best&&best!==Infinity)?q.points:0; } return (String(a.answer).trim().toLowerCase()===String(q.correct).trim().toLowerCase())?q.points:0; }
function todayKey(d=new Date()){ const y=d.getFullYear(); const m=String(d.getMonth()+1).padStart(2,"0"); const day=String(d.getDate()).padStart(2,"0"); return `${y}-${m}-${day}`; }
function matchDateKey(m){ if(m&&m.kickoff){ const d=new Date(m.kickoff); if(!isNaN(d)) return todayKey(d); } return null; }
function todaysMatches(){ const key=todayKey(); return matches.filter(m=>matchDateKey(m)===key); }
function autoOpsNews(){ const today=todaysMatches(); for(const m of today){ const msg=OPS_TEAM_MESSAGES[m.home]||OPS_TEAM_MESSAGES[m.away]; if(msg) return msg; } const openToday=today.filter(m=>!isClosed(m)); if(openToday.length===1){ const m=openToday[0]; return `${m.home} vs. ${m.away} tonight — predictions are open.`; } if(openToday.length>1){ return `${openToday.length} matches on today's board — don't miss the cutoff.`; } const scored=matches.filter(m=>m.finished).length; if(scored>0) return `Flight Deck live: ${scored} scored match${scored===1?"":"es"} already counted.`; return "Predictions are open — pick your scores before boarding closes."; }
function currentOpsNews(){ if(opsNewsMode==="custom"&&opsNewsCustom.trim()) return opsNewsCustom.trim(); if(opsNewsMode==="preset"&&opsNewsPreset.trim()) return opsNewsPreset.trim(); return autoOpsNews(); }
function renderOpsLine(){ const msg=currentOpsNews(); return msg?`<div class="opsline"><span class="label">OPS news</span>${esc(msg)}</div>`:""; }
function totals(){ const players=new Set(); tips.forEach(t=>players.add(t.player)); bonusAnswers.forEach(a=>players.add(a.player)); return [...players].map(name=>{ let pts=0,exact=0,bonus=0; tips.filter(t=>t.player===name).forEach(t=>{ const m=matches.find(x=>x.id===t.match_id); const s=scoreOf(t,m); if(s!=null){pts+=s;if(isExactHit(t,m))exact++;} }); bonusQs.forEach(q=>{const e=bonusEarned(q,name);if(e){pts+=e;bonus+=e;}}); return {name,pts,exact,bonus}; }).sort((a,b)=> b.pts-a.pts || b.exact-a.exact || a.name.localeCompare(b.name)); }
function renderMe(){ const bar=$("#meBar"); if(!me){ bar.innerHTML=`<label>Who are you?</label><div class="row"><input id="nameIn" type="text" placeholder="Your name" maxlength="24"><button class="btn" id="setName">Join</button></div><div class="hint" style="margin:8px 0 0">Your name puts you on the Flight Deck. Spell it the same way every time. 😉</div>`; $("#setName").onclick=()=>{ const v=$("#nameIn").value.trim(); if(!v)return; me=v; try{ localStorage.setItem("wm_me",me); }catch(e){} renderMe(); renderView(); }; $("#nameIn").onkeydown=e=>{if(e.key==="Enter")$("#setName").click();}; }else{ bar.innerHTML=`<div class="row" style="justify-content:space-between;margin:0"><div class="who">Playing as <b>${esc(me)}</b></div><button class="btn ghost sm" id="logout">switch</button></div>`; $("#logout").onclick=()=>{ me=""; try{ localStorage.removeItem("wm_me"); }catch(e){} renderMe(); renderView(); }; } }
function allPicksHTML(matchId,rHome,rAway,finished){ const mt=tips.filter(t=>t.match_id===matchId); if(!mt.length) return '<div class="all-picks"><span style="font-size:12px;color:var(--mut)">No picks yet</span></div>'; const chips=mt.map(t=>{ const isMe=t.player===me; let cls="pick-chip"; if(finished&&rHome!=null){ const exact=+t.home_tip===+rHome&&+t.away_tip===+rAway; const good=!exact&&Math.sign(+t.home_tip-+t.away_tip)===Math.sign(+rHome-+rAway); if(exact) cls+=" exact"; else if(good) cls+=" good"; } if(isMe) cls+=" me"; return `<span class="${cls}">${esc(t.player)} ${t.home_tip}:${t.away_tip}</span>`; }).join(""); return `<div class="all-picks">${chips}</div>`; }
function toggleReveal(id,btn){ const el=document.getElementById('rev-'+id); if(!el) return; const hidden=el.style.display==="none"; el.style.display=hidden?"block":"none"; btn.textContent=hidden?"👀 Hide picks":"👀 Show all picks"; }
function matchCard(m){ const pick=myPick(m.id)||{}; const closed=isClosed(m); const head=`<div class="meta"><span class="grp">${m.phase==="Group"?("Group "+(m.grp||"")):esc(m.phase)}</span><span>${esc(m.match_date)} · ${esc(m.match_time)}${closed&&!m.finished?" · 🛑 Gate closed":""}</span></div>`; if(m.finished){ const s=scoreOf(pick,m),has=pick.home_tip!=null; return `<div class="match">${head}<div class="teams"><div class="team">${flagHTML(m.home)}<span class="tname">${esc(m.home)}</span></div><div class="result"><span class="lbl">Full time</span><span class="final num">${m.home_score}:${m.away_score}</span></div><div class="team away">${flagHTML(m.away)}<span class="tname">${esc(m.away)}</span></div></div>${statusBanner(m)}<div class="pts"><span>Your pick: <b class="num">${has?pick.home_tip+":"+pick.away_tip:"—"}</b></span>${has?`<span class="pill ${s===0?"zero":""}">${s} pts</span>`:`<span class="locked">no pick</span>`}</div>${allPicksHTML(m.id,m.home_score,m.away_score,true)}</div>`; } const dis=closed?"disabled":""; const revealSection=closed?`<button class="reveal-toggle" onclick="toggleReveal(${m.id},this)">👀 Show all picks</button><div id="rev-${m.id}" style="display:none">${allPicksHTML(m.id,null,null,false)}</div>`:""; return `<div class="match" data-m="${m.id}">${head}<div class="teams"><div class="team">${flagHTML(m.home)}<span class="tname">${esc(m.home)}</span></div><div class="score"><input type="number" min="0" max="99" class="num" data-side="h" value="${pick.home_tip??""}" ${dis} oninput="if(this.value!==''&&+this.value<0)this.value=0"><span class="sep">:</span><input type="number" min="0" max="99" class="num" data-side="a" value="${pick.away_tip??""}" ${dis} oninput="if(this.value!==''&&+this.value<0)this.value=0"></div><div class="team away">${flagHTML(m.away)}<span class="tname">${esc(m.away)}</span></div></div>${statusBanner(m)}${revealSection}</div>`; }
function nextKickoff(){ const future=matches.filter(m=>m.kickoff && !m.finished).map(m=>({m,t:new Date(m.kickoff).getTime()})).filter(x=>!isNaN(x.t)&&x.t>Date.now()).sort((a,b)=>a.t-b.t); if(!future.length) return null; return future[0]; }
function countdownLine(){ const nk=nextKickoff(); if(!nk) return ""; const diff=nk.t-Date.now(); const h=Math.floor(diff/3600000); const mm=Math.floor((diff%3600000)/60000); const hh=String(h).padStart(2,"0"); const mi=String(mm).padStart(2,"0"); return `<div class="livebar"><span class="livechip"><span class="dot"></span>Nächster Abflug in ${hh}:${mi} h</span></div>`; }
function poolConsensusLine(){ const finished=matches.filter(m=>m.finished); if(!finished.length) return ""; const all=openConsensusRows(); return all.length?`<div class="livebar"><span class="livechip">Pool-Konsens: ${esc(all[0].label)}</span></div>`:""; }
function openConsensusRows(){ const res=[]; matches.filter(m=>m.finished).forEach(m=>{ const rows=tips.filter(t=>t.match_id===m.id); if(!rows.length) return; const counts={}; rows.forEach(r=>{ const k=`${r.home_tip}:${r.away_tip}`; counts[k]=(counts[k]||0)+1; }); const best=Object.entries(counts).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]))[0]; if(best) res.push({id:m.id,label:best[0],n:best[1]}); }); return res.sort((a,b)=>b.n-a.n||a.label.localeCompare(b.label)); }
function bonusCard(q){ const a=bonusAnswers.find(x=>x.question_id===q.id&&x.player===me); const myVal=a?a.answer:""; const meta=`<div class="meta"><span>${q.points} pts ${q.qtype==="number"?"· closest wins":""}</span><span>${q.resolved?"✅ resolved":(q.locked?"🔒 closed":"open")}</span></div>`; let control=""; if(q.resolved||q.locked){ control=`<input type="text" value="${esc(myVal||"—")}" disabled>`; }else if(q.qtype==="choice"){ const opts=(()=>{try{return JSON.parse(q.options||"[]")}catch(e){return[]}})(); control=`<select data-q="${q.id}"><option value="">Choose…</option>${opts.map(o=>`<option ${myVal===o?"selected":""}>${esc(o)}</option>`).join("")}</select>`; }else if(q.qtype==="number"){ control=`<input type="number" data-q="${q.id}" value="${esc(myVal)}" placeholder="Your number">`; }else{ control=`<input type="text" data-q="${q.id}" value="${esc(myVal)}" placeholder="Your answer">`; } let footer=""; if(q.resolved){ const e=bonusEarned(q,me); footer=`<div class="correct"><span>Correct: <b>${esc(q.correct)}</b></span>${a?`<span class="pill ${e?"":"zero"}">${e||0} pts</span>`:`<span class="locked">no answer</span>`}</div>`; } return `<div class="bonus">${meta}<div class="q">${esc(q.question)}</div>${control}${footer}</div>`; }
function renderBonus(){ if(!me) return `<div class="hint" style="text-align:center;margin-top:20px">Enter your name above to play the bonus round.</div>`; if(!bonusQs.length) return `<div class="empty">No bonus questions yet.<br>Big-picture predictions for the whole tournament will appear here. 🎲</div>`; let html=`<div class="hint"><b>Important:</b> Bonus questions must be answered before the first match kicks off.</div>`; html+=bonusQs.map(bonusCard).join(""); if(bonusQs.some(q=>!q.resolved&&!q.locked)) html+=`<button class="btn gold" id="saveBonus" style="width:100%;padding:14px;margin-top:8px;color:#1a1a1a">Save bonus answers</button>`; return html; }
async function saveBonus(){ const rows=[]; document.querySelectorAll('[data-q]').forEach(el=>{ const id=+el.dataset.q; const v=String(el.value).trim(); if(v!=="") rows.push({player:me,question_id:id,answer:v}); }); if(!rows.length){toast("Nothing to save yet");return;} const {error}=await sb.from("bonus_answers").upsert(rows,{onConflict:"player,question_id"}); if(error){toast("Save failed");return;} await loadAll();toast("Bonus answers saved ✓"); }
function fireConfetti(){ if(typeof confetti==="undefined") return; confetti({particleCount:120,spread:80,origin:{y:0.6},colors:["#f4b400","#19194B","#ffffff","#2d52c8"]}); setTimeout(()=>confetti({particleCount:60,spread:120,origin:{y:0.5},angle:60}),300); setTimeout(()=>confetti({particleCount:60,spread:120,origin:{y:0.5},angle:120}),500); }
function renderRank(){ const t = totals(); if(!t.length){ return `<div class="empty">No predictions yet.<br>Be the first — the Flight Deck is waiting.</div>`; } const anyScored = matches.some(m=>m.finished) || bonusQs.some(q=>q.resolved); let podium = ""; if(t.length >= 3){ const p = t.slice(0,3); const order = [p[1], p[0], p[2]].filter(Boolean); const cls = ["second","first","third"]; const med = ["🥈","🥇","🥉"]; podium = `<div class="podium">${order.map((pl,i)=>`<div class="pod ${cls[i]}"><div class="medal">${med[i]}</div><div class="pname">${esc(pl.name)}</div><div class="ppts num">${pl.pts} pts</div></div>`).join("")}</div>`; } const rows = t.map((p,i)=>{ const r = i + 1; const rankCls = r <= 3 ? `p${r}` : ""; return `<tr class="${p.name===me ? "me-row" : ""}"><td class="rank ${rankCls}">${r}</td><td class="player">${esc(p.name)}${p.name===me ? `<span class="you-tag">(you)</span>` : ``}</td><td class="stat num">${p.exact}</td><td class="stat num">${p.bonus}</td><td class="total num">${p.pts}</td></tr>`; }).join(""); if(me && t.length && t[0].name === me){ if(_lastRank1 !== me){ _lastRank1 = me; setTimeout(fireConfetti, 200); } } else { _lastRank1 = null; } return `${podium}${!anyScored ? `<div class="hint">The Flight Deck fills up once matches are scored or bonus questions are resolved.</div>` : ``}<table class="rank-table"><colgroup><col class="col-rank"><col class="col-player"><col class="col-hit"><col class="col-bonus"><col class="col-total"></colgroup><thead><tr><th class="rank-h">#</th><th class="player-h">Player</th><th class="stat-h" title="Correct exact scores">🎯 Hits</th><th class="stat-h" title="Bonus question points">Bonus</th><th class="total-h">Total</th></tr></thead><tbody>${rows}</tbody></table>`; }
function renderRules(){ const g=SCORE.group,k=SCORE.knockout; return `<div class="rcard"><h3>How to play 🎮</h3><div class="lead">Predict the score of every match. Climb the Flight Deck. Win chocolate. That's the whole sport.</div><div class="rrow"><span class="pp">⏱️</span><span>Place or change a pick until <b>5 minutes before kickoff</b>. After that it's locked — no take-backs, no "I meant to change it", no mercy.</span></div><div class="rrow"><span class="pp">🥅</span><span>For knockout games, predict the score <b>after 120 minutes</b> (extra time counts, penalty-shootout goals do <b>not</b>). A 1:1 thriller that goes to penalties is scored as 1:1.</span></div><div class="rrow"><span class="pp">🧑</span><span>Enter your name to play — and spell it the same way every time. "Beat", "beat" and "BEAT the Legend" are three different humans to the Flight Deck.</span></div></div><div class="rcard"><h3>Points · Group stage</h3><div class="lead">Points add up — a perfect call stacks all four.</div><div class="rrow"><span class="pp">${g.tendency} pts</span><span>Correct outcome — home win, draw or away win (regardless of goals).</span></div><div class="rrow"><span class="pp">${g.home} pt</span><span>Exact number of <b>home</b> goals.</span></div><div class="rrow"><span class="pp">${g.away} pt</span><span>Exact number of <b>away</b> goals.</span></div><div class="rrow"><span class="pp">${g.diff} pts</span><span>Correct goal difference (with the right winner).</span></div><div class="rmax">🎯 Nail the exact score = ${maxPts({phase:"Group"})} points.</div></div><div class="rcard"><h3>Points · Knockout stage</h3><div class="lead">Same idea, double the drama — everything's worth more.</div><div class="rrow ko"><span class="pp">${k.tendency} pts</span><span>Correct outcome (after 120').</span></div><div class="rrow ko"><span class="pp">${k.home} pts</span><span>Exact number of <b>home</b> goals.</span></div><div class="rrow ko"><span class="pp">${k.away} pts</span><span>Exact number function renderTip(){ if(!matches.length) return `<div class="empty">No matches yet. Add them in the <b>Control Tower</b> tab.</div>`; if(!me) return `<div class="hint" style="text-align:center;margin-top:20px">Enter your name above to start predicting.</div>`; const groupMatches=matches.filter(m=>m.phase==="Group"); const rounds=[...new Set(groupMatches.map(m=>m.round).filter(Boolean))].sort(); const hasRounds=rounds.length>0; const koMatches=matches.filter(m=>m.phase!=="Group"); if(koMatches.length) rounds.push("Knockout"); if(hasRounds&&!rounds.includes(tipRound)) tipRound=rounds[0]||"Round 1"; function roundDot(rnd){ const rm=rnd==="Knockout"?koMatches:matches.filter(m=>m.round===rnd); const open=rm.filter(m=>!isClosed(m)); const picked=open.filter(m=>{const p=myPick(m.id);return p&&p.home_tip!=null;}); if(open.length===0) return "#aab2ad"; if(picked.length===open.length) return "#2d52c8"; if(picked.length>0) return "#f4b400"; return "#e6eae8"; } let nav=`<div class="round-nav" id="roundNav">`; rounds.forEach(r=>{ nav+=`<button class="${r===tipRound?"on":""}" data-rnd="${esc(r)}"><span class="rdot" style="background:${roundDot(r)}"></span>${esc(r)}</button>`; }); nav+=`</div>`; const live=countdownLine(); const consensus=poolConsensusLine(); const visible=tipRound==="Knockout"?koMatches:matches.filter(m=>m.round===tipRound); const fallback=!hasRounds?matches:visible; let html="",last=""; fallback.forEach(m=>{ if(m.match_date!==last){html+=`<div class="day">${esc(m.match_date)}</div>`;last=m.match_date;} html+=matchCard(m); }); const open=fallback.filter(m=>!isClosed(m)); const filled=open.filter(m=>{const p=myPick(m.id);return p&&p.home_tip!=null;}); const progress=open.length?`<div class="hint" style="margin-bottom:10px">📝 ${filled.length}/${open.length} picks entered for this round</div>`:""; const saveBtn=fallback.some(m=>!isClosed(m))?`<button class="btn" id="saveTips" style="width:100%;padding:14px;margin-top:8px">Save predictions</button>`:""; return (hasRounds?nav:"")+live+consensus+renderOpsLine()+progress+html+saveBtn; }
async function saveTips(){ const rows=[]; let missing=false; let invalid=false; [...document.querySelectorAll(".match[data-m]")].forEach(c=>{ const id=+c.dataset.m; const m=matches.find(x=>x.id===id); if(!m||isClosed(m)) return; const hEl=c.querySelector('[data-side="h"]'); const aEl=c.querySelector('[data-side="a"]'); const hRaw=hEl?hEl.value.trim():""; const aRaw=aEl?aEl.value.trim():""; if(hRaw===""&&aRaw==="") return; if(hRaw===""||aRaw===""){ missing=true; return; } const h=Number(hRaw); const a=Number(aRaw); if(!Number.isFinite(h)||!Number.isFinite(a)||h<0||a<0){ invalid=true; return; } rows.push({ player: me, match_id: id, home_tip: Math.round(h), away_tip: Math.round(a) }); }); if(missing){ toast("Please enter both home and away goals."); return; } if(invalid){ toast("Goals must be 0 or higher."); return; } if(!rows.length){ toast("Nothing to save yet."); return; } const { error } = await sb.from("tips").upsert(rows, { onConflict: "player,match_id" }); if(error){ toast("Save failed."); return; } await loadAll(); toast("Predictions saved."); }
function bonusCard(q){ const a=bonusAnswers.find(x=>x.question_id===q.id&&x.player===me); const myVal=a?a.answer:""; const meta=`<div class="meta"><span>${q.points} pts ${q.qtype==="number"?"· closest wins":""}</span><span>${q.resolved?"✅ resolved":(q.locked?"🔒 closed":"open")}</span></div>`; let control=""; if(q.resolved||q.locked){ control=`<input type="text" value="${esc(myVal||"—")}" disabled>`; }else if(q.qtype==="choice"){ const opts=(()=>{try{return JSON.parse(q.options||"[]")}catch(e){return[]}})(); control=`<select data-q="${q.id}"><option value="">Choose…</option>${opts.map(o=>`<option ${myVal===o?"selected":""}>${esc(o)}</option>`).join("")}</select>`; }else if(q.qtype==="number"){ control=`<input type="number" data-q="${q.id}" value="${esc(myVal)}" placeholder="Your number">`; }else{ control=`<input type="text" data-q="${q.id}" value="${esc(myVal)}" placeholder="Your answer">`; } let footer=""; if(q.resolved){ const e=bonusEarned(q,me); footer=`<div class="correct"><span>Correct: <b>${esc(q.correct)}</b></span>${a?`<span class="pill ${e?"":"zero"}">${e||0} pts</span>`:`<span class="locked">no answer</span>`}</div>`; } return `<div class="bonus">${meta}<div class="q">${esc(q.question)}</div>${control}${footer}</div>`; }
function renderBonus(){ if(!me) return `<div class="hint" style="text-align:center;margin-top:20px">Enter your name above to play the bonus round.</div>`; if(!bonusQs.length) return `<div class="empty">No bonus questions yet.<br>Big-picture predictions for the whole tournament will appear here. 🎲</div>`; let html=`<div class="hint"><b>Important:</b> Bonus questions must be answered before the first match kicks off.</div>`; html+=bonusQs.map(bonusCard).join(""); if(bonusQs.some(q=>!q.resolved&&!q.locked)) html+=`<button class="btn gold" id="saveBonus" style="width:100%;padding:14px;margin-top:8px;color:#1a1a1a">Save bonus answers</button>`; return html; }
async function saveBonus(){ const rows=[]; document.querySelectorAll('[data-q]').forEach(el=>{ const id=+el.dataset.q; const v=String(el.value).trim(); if(v!=="") rows.push({player:me,question_id:id,answer:v}); }); if(!rows.length){toast("Nothing to save yet");return;} const {error}=await sb.from("bonus_answers").upsert(rows,{onConflict:"player,question_id"}); if(error){toast("Save failed");return;} await loadAll();toast("Bonus answers saved ✓"); }
function fireConfetti(){ if(typeof confetti==="undefined") return; confetti({particleCount:120,spread:80,origin:{y:0.6},colors:["#f4b400","#19194B","#ffffff","#2d52c8"]}); setTimeout(()=>confetti({particleCount:60,spread:120,origin:{y:0.5},angle:60}),300); setTimeout(()=>confetti({particleCount:60,spread:120,origin:{y:0.5},angle:120}),500); }
function renderRank(){ const t = totals(); if(!t.length){ return `<div class="empty">No predictions yet.<br>Be the first — the Flight Deck is waiting.</div>`; } const anyScored = matches.some(m=>m.finished) || bonusQs.some(q=>q.resolved); let podium = ""; if(t.length >= 3){ const p = t.slice(0,3); const order = [p[1], p[0], p[2]].filter(Boolean); const cls = ["second","first","third"]; const med = ["🥈","🥇","🥉"]; podium = `<div class="podium">${order.map((pl,i)=>`<div class="pod ${cls[i]}"><div class="medal">${med[i]}</div><div class="pname">${esc(pl.name)}</div><div class="ppts num">${pl.pts} pts</div></div>`).join("")}</div>`; } const rows = t.map((p,i)=>{ const r = i + 1; const rankCls = r <= 3 ? `p${r}` : ""; return `<tr class="${p.name===me ? "me-row" : ""}"><td class="rank ${rankCls}">${r}</td><td class="player">${esc(p.name)}${p.name===me ? `<span class="you-tag">(you)</span>` : ``}</td><td class="stat num">${p.exact}</td><td class="stat num">${p.bonus}</td><td class="total num">${p.pts}</td></tr>`; }).join(""); if(me && t.length && t[0].name === me){ if(_lastRank1 !== me){ _lastRank1 = me; setTimeout(fireConfetti, 200); } } else { _lastRank1 = null; } return `${podium}${!anyScored ? `<div class="hint">The Flight Deck fills up once matches are scored or bonus questions are resolved.</div>` : ``}<table class="rank-table"><colgroup><col class="col-rank"><col class="col-player"><col class="col-hit"><col class="col-bonus"><col class="col-total"></colgroup><thead><tr><th class="rank-h">#</th><th class="player-h">Player</th><th class="stat-h" title="Correct exact scores">🎯 Hits</th><th class="stat-h" title="Bonus question points">Bonus</th><th class="total-h">Total</th></tr></thead><tbody>${rows}</tbody></table>`; }
function renderRules(){ const g=SCORE.group,k=SCORE.knockout; return `<div class="rcard"><h3>How to play 🎮</h3><div class="lead">Predict the score of every match. Climb the Flight Deck. Win chocolate. That's the whole sport.</div><div class="rrow"><span class="pp">⏱️</span><span>Place or change a pick until <b>5 minutes before kickoff</b>. After that it's locked — no take-backs, no "I meant to change it", no mercy.</span></div><div class="rrow"><span class="pp">🥅</span><span>For knockout games, predict the score <b>after 120 minutes</b> (extra time counts, penalty-shootout goals do <b>not</b>). A 1:1 thriller that goes to penalties is scored as 1:1.</span></div><div class="rrow"><span class="pp">🧑</span><span>Enter your name to play — and spell it the same way every time. "Beat", "beat" and "BEAT the Legend" are three different humans to the Flight Deck.</span></div></div><div class="rcard"><h3>Points · Group stage</h3><div class="lead">Points add up — a perfect call stacks all four.</div><div class="rrow"><span class="pp">${g.tendency} pts</span><span>Correct outcome — home win, draw or away win (regardless of goals).</span></div><div class="rrow"><span class="pp">${g.home} pt</span><span>Exact number of <b>home</b> goals.</span></div><div class="rrow"><span class="pp">${g.away} pt</span><span>Exact number of <b>away</b> goals.</span></div><div class="rrow"><span class="pp">${g.diff} pts</span><span>Correct goal difference (with the right winner).</span></div><div class="rmax">🎯 Nail the exact score = ${maxPts({phase:"Group"})} points.</div></div><div class="rcard"><h3>Points · Knockout stage</h3><div class="lead">Same idea, double the drama — everything's worth more.</div><div class="rrow ko"><span class="pp">${k.tendency} pts</span><span>Correct outcome (after 120').</span></div><div class="rrow ko"><span class="pp">${k.home} pts</span><span>Exact number of <b>home</b> goals.</span></div><div class="rrow ko"><span class="pp">${k.away} pts</span><span>Exact number of <b>away</b> goals.</span></div><div class="rrow ko"><span class="pp">${k.diff} pts</span><span>Correct goal difference (with the right winner).</span></div><div class="rmax">🎯 Nail the exact score = ${maxPts({phase:"Knockout"})} points.</div></div></div>`; }
function renderPrizes(){ return `<div class="prizehero"><img src="prize-schoki.jpg" alt="SWISS Schoki"><div><div class="ph-title">Cargo Manifest</div><div class="ph-sub">The chocolate cargo is waiting. Top 3 get the sweet delivery.</div></div></div><div class="prize gold"><div class="pmedal">🥇</div><div class="pinfo"><div class="pplace">1st place</div><div class="pwin">SWISS Schoki cargo</div></div></div><div class="prize"><div class="pmedal">🥈</div><div class="pinfo"><div class="pplace">2nd place</div><div class="pwin">SWISS Schoki cargo</div></div></div><div class="prize"><div class="pmedal">🥉</div><div class="pinfo"><div class="pplace">3rd place</div><div class="pwin">SWISS Schoki cargo</div></div></div>`;}
function renderAdmin(){ return `<div class="panel"><h3>Control Tower</h3><div class="rules">Admin area stays unchanged in this replace-code version. Keep your current admin rendering here or paste in your original admin block if you need editing forms.</div></div>`; }
function renderView(){ const view=$("#view"); const tabMap={tip:renderTip,bonus:renderBonus,rank:renderRank,prizes:renderPrizes,rules:renderRules,admin:renderAdmin}; view.innerHTML=tabMap[tab](); document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab)); const saveTipsBtn=document.getElementById("saveTips"); if(saveTipsBtn) saveTipsBtn.onclick=saveTips; const saveBonusBtn=document.getElementById("saveBonus"); if(saveBonusBtn) saveBonusBtn.onclick=saveBonus; document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;renderView();}); }
loadAll();
</script>
