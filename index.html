<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OPSD · World Cup 2026 Pool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
  :root{
    --pitch:#19194B;--pitch-2:#101038;--ink:#141822;--mut:#6b727d;
    --line:#e6eae8;--bg:#f3f6f4;--card:#fff;
    --gold:#f4b400;--silver:#aab2ad;--bronze:#cd7f32;--green:#2d52c8;
    --accent:#19194B;--accent-d:#101038;
    --shadow:0 1px 2px rgba(0,0,0,.04),0 10px 30px rgba(16,16,48,.10);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .num{font-variant-numeric:tabular-nums}
  header{background:linear-gradient(160deg,var(--pitch),var(--pitch-2));color:#fff;padding:18px 16px 0}
  .wrap{max-width:680px;margin:0 auto}
  .hero{display:flex;align-items:center;gap:14px;padding-bottom:14px}
  .logo img{height:46px;width:auto;display:block;border-radius:8px}
  .badge{height:46px;min-width:46px;padding:0 12px;border-radius:12px;background:var(--gold);color:#1a1a1a;
    font-family:"Anton",sans-serif;font-size:22px;letter-spacing:1px;display:flex;align-items:center;justify-content:center}
  .htext .title{font-family:"Anton",sans-serif;font-size:26px;line-height:1;letter-spacing:.5px}
  .htext .sub{font-size:12.5px;opacity:.85;margin-top:4px;font-weight:500}
  nav{display:flex;gap:2px;max-width:680px;margin:0 auto;overflow-x:auto;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav button{flex:1 0 auto;white-space:nowrap;background:none;border:0;color:rgba(255,255,255,.7);font:inherit;font-weight:700;font-size:13.5px;padding:12px 14px;cursor:pointer;border-bottom:3px solid transparent}
  nav button.on{color:#fff;border-bottom-color:var(--gold)}
  main{max-width:680px;margin:0 auto;padding:16px 16px 70px}
  .me{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:16px;box-shadow:var(--shadow)}
  .me label{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
  .me .row{display:flex;gap:8px;margin-top:8px;align-items:center}
  input,select{font:inherit}
  .me input[type=text]{flex:1;border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:15px}
  .me .who{font-size:15px}.me .who b{color:var(--accent)}
  .btn{background:var(--accent);color:#fff;border:0;border-radius:9px;padding:10px 16px;font:inherit;font-weight:700;font-size:14px;cursor:pointer}
  .btn:hover{background:var(--accent-d)}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn.gold{background:var(--gold);color:#1a1a1a}
  .btn.sm{padding:7px 12px;font-size:13px}
  .day{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;margin:18px 4px 8px}
  .match,.bonus{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
  .match .meta{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin-bottom:8px;font-weight:500}
  .match .grp{background:var(--bg);border-radius:5px;padding:1px 7px;font-weight:700}
  .teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
  .team{display:flex;align-items:center;gap:8px;min-width:0}
  .team.away{flex-direction:row-reverse;text-align:right}
  .flag{width:28px;height:21px;object-fit:cover;border-radius:3px;box-shadow:0 0 0 1px rgba(0,0,0,.1);display:block;flex:0 0 auto}
  .flag-emoji{font-size:22px}
  .tname{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .trank{font-size:10.5px;font-weight:800;color:var(--mut);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 5px;flex:0 0 auto;font-variant-numeric:tabular-nums}
  .score{display:flex;align-items:center;gap:6px}
  .score input{width:42px;height:42px;text-align:center;font-size:18px;font-weight:700;border:1.5px solid var(--line);border-radius:10px;-moz-appearance:textfield}
  .score input::-webkit-outer-spin-button,.score input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .score input:focus{outline:none;border-color:var(--accent)}
  .score input:disabled{background:var(--bg);color:var(--mut)}
  .sep{color:var(--mut);font-weight:700}
  .result{display:flex;flex-direction:column;align-items:center;gap:2px}
  .result .final{font-size:20px;font-weight:800}
  .result .lbl{font-size:9px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
  .pts{margin-top:8px;font-size:13px;display:flex;justify-content:space-between;align-items:center;border-top:1px dashed var(--line);padding-top:8px;color:var(--mut)}
  .pts b{color:var(--ink)}
  .pill{background:var(--green);color:#fff;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:700}
  .pill.zero{background:#e6eae8;color:var(--mut)}
  .locked{font-size:11px;color:var(--mut);font-style:italic}
  .bonus .q{font-size:15px;font-weight:700;margin-bottom:10px;line-height:1.35}
  .bonus .meta{font-size:11px;color:var(--mut);font-weight:600;display:flex;justify-content:space-between;margin-bottom:8px}
  .bonus input[type=text],.bonus input[type=number],.bonus select{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:15px}
  .bonus input:disabled,.bonus select:disabled{background:var(--bg);color:var(--mut)}
  .correct{margin-top:8px;font-size:13px;color:var(--mut);border-top:1px dashed var(--line);padding-top:8px;display:flex;justify-content:space-between;align-items:center}
  .correct b{color:var(--ink)}
  .tag{display:inline-block;background:var(--bg);border-radius:6px;padding:1px 8px;font-size:11px;font-weight:700;color:var(--mut);margin-left:6px}
  .podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin:6px 0 16px}
  .pod{flex:1;max-width:150px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center;box-shadow:var(--shadow)}
  .pod .medal{font-size:26px}
  .pod .pname{font-weight:800;font-size:14px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pod .ppts{font-size:13px;color:var(--mut);font-weight:700}
  .pod.first{transform:translateY(-10px);border-color:var(--gold);box-shadow:0 10px 30px rgba(244,180,0,.25)}
  table.rank-table{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:0;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
  table.rank-table col.col-rank{width:36px}
  table.rank-table col.col-player{width:auto}
  table.rank-table col.col-hit{width:46px}
  table.rank-table col.col-points{width:56px}
  table.rank-table col.col-bonus{width:54px}
  table.rank-table col.col-total{width:62px}
  table.rank-table th,table.rank-table td{padding:13px 7px;border-bottom:1px solid var(--line);vertical-align:middle}
  table.rank-table th,table.rank-table td{padding:16px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
  table.rank-table th{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--mut);background:#fafbfb;font-weight:800}
  table.rank-table tr:last-child td{border-bottom:0}
  table.rank-table th.rank-h,table.rank-table td.rank{text-align:left}
  table.rank-table th.player-h,table.rank-table td.player{text-align:left}
  table.rank-table th.stat-h,table.rank-table td.stat,table.rank-table th.total-h,table.rank-table td.total{text-align:right}
  table.rank-table td.rank{font-weight:800;font-size:17px}
  table.rank-table td.player{font-size:17px;font-weight:700}
  table.rank-table td.stat{font-size:17px;font-variant-numeric:tabular-nums}
  table.rank-table td.total{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
  .me-row{background:#eef1fb}
  .rank.p1{color:var(--gold)} .rank.p2{color:var(--silver)} .rank.p3{color:var(--bronze)}
  .you-tag{color:var(--accent);font-size:12px;font-weight:800;margin-left:6px;white-space:nowrap}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:var(--shadow)}
  .panel h3{margin:0 0 12px;font-size:15px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .field{margin-bottom:8px}
  .field label{display:block;font-size:11px;font-weight:700;color:var(--mut);margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px}
  .field input,.field select{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 10px;font-size:14px}
  .rules{font-size:13px;line-height:1.7;color:var(--mut)} .rules b{color:var(--ink)}
  .adminmatch{display:flex;align-items:center;gap:6px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;flex-wrap:wrap}
  .adminmatch .nm{flex:1;min-width:150px}
  .adminmatch input,.adminbq input{width:46px;text-align:center;border:1px solid var(--line);border-radius:6px;padding:6px 4px;font-size:14px;font-weight:700}
  .adminbq{padding:11px 0;border-bottom:1px solid var(--line);font-size:13px}
  .adminbq .qx{font-weight:700;margin-bottom:6px}
  .adminbq .ctrl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .adminbq input[type=text]{width:auto;flex:1;min-width:120px;text-align:left;font-weight:500}
  .empty{text-align:center;color:var(--mut);padding:40px 16px;font-size:14px;line-height:1.5}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:30px;font-size:14px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.25);opacity:0;transition:.25s;pointer-events:none;z-index:99}
  .toast.show{opacity:1;bottom:30px}
  .hint{font-size:12px;color:var(--mut);margin:4px 4px 14px;line-height:1.5}
  .opsline{background:linear-gradient(135deg,#fffdf5,#f7f3e8);border:1px solid #eee2bd;border-radius:12px;padding:11px 14px;margin:0 0 12px;box-shadow:var(--shadow);font-size:13.5px;font-weight:700;color:#6a4b00;line-height:1.45}
  .opsline .label{display:inline-block;margin-right:8px;font-size:11px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:#8a6a10}
  .loading{text-align:center;padding:50px;color:var(--mut)}
  .round-nav{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .round-nav::-webkit-scrollbar{display:none}
  .round-nav button{flex:0 0 auto;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 14px;font:inherit;font-size:13px;font-weight:700;color:var(--mut);cursor:pointer;white-space:nowrap}
  .round-nav button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .round-nav button .rdot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle}
  .all-picks{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px;display:flex;flex-wrap:wrap;gap:5px}
  .pick-chip{font-size:12px;font-weight:700;background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:3px 10px;color:var(--mut);white-space:nowrap}
  .pick-chip.exact{background:#e3e9fc;border-color:#aebef0;color:#1b2e7a}
  .pick-chip.good{background:#fef9c3;border-color:#fde047;color:#854d0e}
  .pick-chip.me{border-color:var(--accent);color:var(--accent)}
  .reveal-toggle{font-size:11px;font-weight:700;color:var(--mut);cursor:pointer;margin-top:8px;display:inline-block;border:0;background:none;padding:0}
  .reveal-toggle:hover{color:var(--ink)}
  .prizehero{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,#fff,#fff7e6);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow);margin-bottom:16px}
  .prizehero img{width:120px;height:auto;border-radius:12px;object-fit:cover;box-shadow:0 4px 14px rgba(0,0,0,.12)}
  .ph-title{font-family:"Anton",sans-serif;font-size:23px;line-height:1}
  .ph-sub{font-size:13px;color:var(--mut);margin-top:6px;line-height:1.45}
  .prize{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);margin-bottom:10px}
  .prize .pmedal{font-size:32px;line-height:1}
  .prize .pinfo{flex:1}
  .prize .pplace{font-weight:800;font-size:15px}
  .prize .pwin{color:var(--mut);font-size:14px;font-weight:600;margin-top:2px}
  .prize .pcount{font-size:20px;letter-spacing:2px}
  .prize.gold{border-color:var(--gold);box-shadow:0 8px 26px rgba(244,180,0,.2)}
  .rcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
  .rcard h3{margin:0 0 4px;font-size:17px;font-family:"Anton",sans-serif;letter-spacing:.3px}
  .rcard .lead{color:var(--mut);font-size:13px;margin-bottom:12px;line-height:1.5}
  .rrow{display:flex;align-items:flex-start;gap:10px;padding:7px 0;font-size:14px;line-height:1.45;border-bottom:1px dashed var(--line)}
  .rrow:last-child{border-bottom:0}
  .rrow .pp{flex:0 0 auto;min-width:54px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
  .rrow.ko .pp{color:#b8860b}
  .rmax{margin-top:8px;font-size:13px;font-weight:700;background:var(--bg);border-radius:8px;padding:8px 10px}
  .fineprint{font-size:13.5px;line-height:1.6;color:var(--ink)}
  .fineprint li{margin-bottom:8px}
  .fineprint b{color:var(--accent)}
  .livebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 12px}
  .livechip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 11px;font-size:12px;font-weight:700;color:var(--mut)}
  .dot{width:8px;height:8px;border-radius:50%;background:#22c55e;display:inline-block}
  .cd-chip{display:inline-block;background:#eef1fb;color:var(--accent);border:1px solid #d7ddf5;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:800;letter-spacing:.2px;white-space:nowrap}
  .tailopt{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:3px;cursor:pointer;line-height:0;display:inline-flex}
  .tailopt.sel{border-color:var(--accent);box-shadow:0 0 0 2px rgba(25,25,75,.18)}
    /* Schwebender Cabin-Log-Button unten rechts (Lufthansa Blau) */
  .cabin-log-btn {
    background: #002F6C; /* Exaktes Lufthansa-Blau */
    color: #ffffff; /* Weisser Text */
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 30px;
    padding: 10px 18px;
    font-weight: 700;
    font-size: 13.5px;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: transform 0.2s, background-color 0.2s;
  }
  .cabin-log-btn:hover {
    background: #00204a; /* Etwas dunkleres Blau beim Drüberfahren */
    transform: scale(1.05);
  }

  /* Kleines Feedback-Popup-Fenster direkt über dem Button */
  .cabin-log-popup {
    display: none; /* Am Anfang unsichtbar */
    position: fixed;
    bottom: 70px;
    right: 20px;
    width: 300px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    box-shadow: 0 10px 30px rgba(16,16,48,0.2);
    z-index: 1000;
  }
  .cabin-log-popup h4 {
    margin: 0 0 8px;
    font-size: 14px;
    font-weight: 700;
  }
  .cabin-log-popup textarea {
    width: 100%;
    min-height: 80px;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px;
    font: inherit;
    font-size: 13px;
    resize: none;
  }
  .cabin-log-popup textarea:focus {
    outline: none;
    border-color: #002F6C;
  }
  .cabin-log-popup .actions {
    display: flex;
    justify-content: flex-end;
    gap: 6px;
    margin-top: 8px;
  }

</style>
</head>

function nextKickoff(){ const future=matches.filter(m=>m.kickoff && !m.finished).map(m=>({m,t:new Date(m.kickoff).getTime()})).filter(x=>!isNaN(x.t)&&x.t>Date.now()).sort((a,b)=>a.t-b.t); if(!future.length) return null; return future[0]; }
function fmtCountdown(ms){ if(ms<0) ms=0; const totalMin=Math.floor(ms/60000); const d=Math.floor(totalMin/1440); const h=Math.floor((totalMin%1440)/60); const mi=totalMin%60; if(d>0) return `${d}d ${h}h`; if(h>0) return `${h}h ${String(mi).padStart(2,"0")}m`; return `${mi}m`; }
function countdownLine(){ const nk=nextKickoff(); if(!nk) return ""; const diff=nk.t-Date.now(); const h=Math.floor(diff/3600000); const mm=Math.floor((diff%3600000)/60000); const hh=String(h).padStart(2,"0"); const mi=String(mm).padStart(2,"0"); return `<div class="livebar"><span class="livechip"><span class="dot"></span>Nächster Abflug in ${hh}:${mi} h</span></div>`; }
function poolConsensusLine(){ const finished=matches.filter(m=>m.finished); if(!finished.length) return ""; const all=openConsensusRows(); return all.length?`<div class="livebar"><span class="livechip">Pool-Konsens: ${esc(all[0].label)}</span></div>`:""; }
function openConsensusRows(){ const res=[]; matches.filter(m=>m.finished).forEach(m=>{ const rows=tips.filter(t=>t.match_id===m.id); if(!rows.length) return; const counts={}; rows.forEach(r=>{ const k=`${r.home_tip}:${r.away_tip}`; counts[k]=(counts[k]||0)+1; }); const best=Object.entries(counts).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]))[0]; if(best) res.push({id:m.id,label:best[0],n:best[1]}); }); return res.sort((a,b)=>b.n-a.n||a.label.localeCompare(b.label)); }

function renderTip(){ 
  if(!matches.length) return `<div class="empty">No matches yet. Add them in the <b>Control Tower</b> tab.</div>`; 

  // --- HIER: Code für das Profil-Panel einfügen ---
  const meBarHTML = `<div id="meBar" class="me"></div>`;
  // ----------------------------------------------------

  if(!me) return meBarHTML + `<div class="hint" style="text-align:center;margin-top:20px">Enter your name above to start predicting.</div>`;

  
  // ----------------------------------------------------

  const groupMatches=matches.filter(m=>m.phase==="Group");
  
  const rounds=[...new Set(groupMatches.map(m=>m.round).filter(Boolean))].sort(); 

  const hasRounds=rounds.length>0; 
  const koMatches=matches.filter(m=>m.phase!=="Group"); 
  if(koMatches.length) rounds.push("Knockout"); 
  if(hasRounds&&!rounds.includes(tipRound)) tipRound=rounds[0]||"Round 1"; 

  function roundDot(rnd){ 
    const rm=rnd==="Knockout"?koMatches:matches.filter(m=>m.round===rnd); 
    const open=rm.filter(m=>!isClosed(m)); 
    const picked=open.filter(m=>{const p=myPick(m.id);return p&&p.home_tip!=null;}); 
    if(open.length===0) return "#aab2ad"; 
    if(picked.length===open.length) return "#2d52c8"; 
    if(picked.length>0) return "#f4b400"; 
    return "#e6eae8"; 
  } 
  
  let nav=`<div class="round-nav" id="roundNav">`; 
  rounds.forEach(r=>{ 
    nav+=`<button class="${r===tipRound?"on":""}" data-rnd="${esc(r)}"><span class="rdot" style="background:${roundDot(r)}"></span>${esc(r)}</button>`; 
  }); 
  nav+=`</div>`; 

  const visible=tipRound==="Knockout"?koMatches:matches.filter(m=>m.round===tipRound); 
  const fallback=!hasRounds?matches:visible; 

  // --- HIER IST DIE EINZIGE KORREKTUR ---
  const pickedInRound = fallback.filter(m => {const p = myPick(m.id); return p && p.home_tip != null;}).length;
  const totalInRound = fallback.length; 

  const chips=[]; 
  if(totalInRound > 0) {
    chips.push(`<span class="livechip">📝 ${pickedInRound}/${totalInRound} picks this round</span>`); 
  }
  // --- ENDE DER KORREKTUR ---

  const statusBar=chips.length?`<div class="livebar">${chips.join("")}</div>`:""; 
  const days=[]; 
  fallback.forEach(m=>{ 
    let d=days.find(x=>x.date===m.match_date); 
    if(!d){d={date:m.match_date,ms:[]};days.push(d);} 
    d.ms.push(m); 
  }); 
  
  let html=""; 
  days.forEach(d=>{ 
    html+=`<div class="day">${esc(d.date)}</div>`; 
    d.ms.forEach(m=>{html+=matchCard(m);}); 
    if(d.ms.some(m=>!isClosed(m))) {
      html+=`<button class="btn js-savetips" style="width:100%;padding:13px;margin:4px 0 18px">Save predictions</button>`; 
    }
  }); 
  
  return meBarHTML + (hasRounds ? nav : "") + renderOpsLine() + statusBar + html; 
}

async function saveTips(){ const rows=[]; let missing=false; let invalid=false; [...document.querySelectorAll(".match[data-m]")].forEach(c=>{ const id=+c.dataset.m; const m=matches.find(x=>x.id===id); if(!m||isClosed(m)) return; const hEl=c.querySelector('[data-side="h"]'); const aEl=c.querySelector('[data-side="a"]'); const hRaw=hEl?hEl.value.trim():""; const aRaw=aEl?aEl.value.trim():""; if(hRaw===""&&aRaw==="") return; if(hRaw===""||aRaw===""){ missing=true; return; } const h=Number(hRaw); const a=Number(aRaw); if(!Number.isFinite(h)||!Number.isFinite(a)||h<0||a<0){ invalid=true; return; } rows.push({ player: me, match_id: id, home_tip: Math.round(h), away_tip: Math.round(a) }); }); if(missing){ toast("Please enter both home and away goals."); return; } if(invalid){ toast("Goals must be 0 or higher."); return; } if(!rows.length){ toast("Nothing to save yet."); return; } const { error } = await sb.from("tips").upsert(rows, { onConflict: "player,match_id" }); if(error){ toast("Save failed."); return; } await loadAll(); toast("Predictions saved."); }
function firstKickoff(){ const ks=matches.map(m=>m.kickoff?new Date(m.kickoff).getTime():NaN).filter(t=>!isNaN(t)); return ks.length?Math.min(...ks):null; }
function bonusLocked(){ const f=firstKickoff(); return f!=null && Date.now()>=f; }
function bonusCard(q){ const a=bonusAnswers.find(x=>x.question_id===q.id&&x.player===me); const myVal=a?a.answer:""; const closed=q.locked||bonusLocked(); const meta=`<div class="meta"><span>${q.points} pts ${q.qtype==="number"?"· closest wins":""}</span><span>${q.resolved?"✅ resolved":(closed?"🔒 closed":"open")}</span></div>`; let control=""; if(q.resolved||closed){ control=`<input type="text" value="${esc(myVal||"—")}" disabled>`; }else if(q.qtype==="choice"){ const opts=(()=>{try{return JSON.parse(q.options||"[]")}catch(e){return[]}})(); control=`<select data-q="${q.id}"><option value="">Choose…</option>${opts.map(o=>`<option ${myVal===o?"selected":""}>${esc(o)}</option>`).join("")}</select>`; }else if(q.qtype==="number"){ control=`<input type="number" data-q="${q.id}" value="${esc(myVal)}" placeholder="Your number">`; }else{ control=`<input type="text" data-q="${q.id}" value="${esc(myVal)}" placeholder="Your answer">`; } let footer=""; if(q.resolved){ const e=bonusEarned(q,me); footer=`<div class="correct"><span>Correct: <b>${esc(q.correct)}</b></span>${a?`<span class="pill ${e?"":"zero"}">${e||0} pts</span>`:`<span class="locked">no answer</span>`}</div>`; } return `<div class="bonus">${meta}<div class="q">${esc(q.question)}</div>${control}${footer}</div>`; }
function renderBonus(){
  const meBarHTML = `<div id="meBar" class="me"></div>`;
  if(!me) return meBarHTML + `<div class="hint" style="text-align:center;margin-top:20px">Enter your name above to play the bonus round.</div>`;
  if(!bonusQs.length) return `<div class="empty">No bonus questions yet.<br>Big-picture predictions for the whole tournament will appear here. 🎲</div>`;
  let html=`<div class="opsline" style="margin-bottom:12px"><span class="label">${bonusLocked()?"✈ closed":"✈ important"}</span>${bonusLocked()?"These answers are now locked — the tournament has started.":"Answer all upgrades <b>before the first match</b> — they lock once it kicks off."}</div>`;
  html+=bonusQs.map(bonusCard).join("");
  if(!bonusLocked() && bonusQs.some(q=>!q.resolved&&!q.locked)) html+=`<button class="btn gold" id="saveBonus" style="width:100%;padding:14px;margin-top:8px;color:#1a1a1a">Save bonus answers</button>`;
  return html;
}
async function saveBonus(){ if(bonusLocked()){toast("Bonus is closed — the tournament has started");return;} const rows=[]; document.querySelectorAll('[data-q]').forEach(el=>{ const id=+el.dataset.q; const v=String(el.value).trim(); if(v!=="") rows.push({player:me,question_id:id,answer:v}); }); if(!rows.length){toast("Nothing to save yet");return;} const {error}=await sb.from("bonus_answers").upsert(rows,{onConflict:"player,question_id"}); if(error){toast("Save failed");return;} await loadAll();toast("Bonus answers saved ✓"); }
function fireConfetti(){ if(typeof confetti==="undefined") return; confetti({particleCount:120,spread:80,origin:{y:0.6},colors:["#f4b400","#19194B","#ffffff","#2d52c8"]}); setTimeout(()=>confetti({particleCount:60,spread:120,origin:{y:0.5},angle:60}),300); setTimeout(()=>confetti({particleCount:60,spread:120,origin:{y:0.5},angle:120}),500); }
function renderRank(){ const t = totals(); if(!t.length){ return `<div class="empty">No predictions yet.<br>Be the first — the Flight Deck is waiting.</div>`; } const anyScored = matches.some(m=>m.finished) || bonusQs.some(q=>q.resolved); let podium = ""; if(t.length >= 3){ const p = t.slice(0,3); const order = [p[1], p[0], p[2]].filter(Boolean); const cls = ["second","first","third"]; const med = ["🥈","🥇","🥉"]; podium = `<div class="podium">${order.map((pl,i)=>`<div class="pod ${cls[i]}"><div class="medal">${med[i]}</div><div class="pname">${tailHTML(tailOf(pl.name),26)} ${esc(pl.name)}</div><div class="ppts num">${pl.pts} pts</div></div>`).join("")}</div>`; } const rows = t.map((p,i)=>{ const r = i + 1; const rankCls = r <= 3 ? `p${r}` : ""; return `<tr class="${p.name===me ? "me-row" : ""}"><td class="rank ${rankCls}">${r}</td><td class="player"><span style="display:inline-flex;align-items:center;gap:7px">${tailHTML(tailOf(p.name),24)}<span>${esc(p.name)}${p.name===me ? `<span class="you-tag">(you)</span>` : ``}</span></span></td> <td class="stat num">${p.exact}</td><td class="stat num">${p.pts - p.bonus}</td><td class="stat num">${p.bonus}</td><td class="total num">${p.pts}</td> </tr>`; }).join(""); if(me && t.length && t[0].name === me){ if(_lastRank1 !== me){ _lastRank1 = me; setTimeout(fireConfetti, 200); } } else { _lastRank1 = null; } return `${podium}${!anyScored ? `<div class="hint">The Flight Deck fills up once matches are scored or bonus questions are resolved.</div>` : ``}<table class="rank-table"><colgroup><col class="col-rank"><col class="col-player"><col class="col-hit"><col class="col-points"><col class="col-bonus"><col class="col-total"></colgroup><thead><tr><th class="rank-h">#</th><th class="player-h">Player</th><th class="stat-h" title="Exact-score hits — info only">Hits</th><th class="stat-h" title="Points from match predictions">Points</th><th class="stat-h" title="Bonus question points">Bonus</th><th class="total-h">Total</th></tr></thead><tbody>${rows}</tbody></table>`; }
function renderAirlineStandings() {
  const t = totals();
  if (!t.length) return "";

  const byTail = {};
  t.forEach(p => {
    const code = tailOf(p.name);
    if (!byTail[code]) byTail[code] = { code: code, players: 0, pts: 0, exact: 0, bonus: 0 };
    const a = byTail[code];
    a.players++; a.pts += p.pts; a.exact += p.exact; a.bonus += p.bonus;
  });

  const allAirlines = Object.values(byTail);
  if (!allAirlines.length) return "";

  // 1. Berechne die zwei Awards
  const biggestFleet = allAirlines.reduce((best, current) => (current.pts > best.pts ? current : best));
  
  const sharpestCrew = allAirlines
    .filter(a => a.players >= 3) // Mindestens 3 Spieler für diesen Award
    .map(a => ({ ...a, avg: a.pts / a.players }))
    .reduce((best, current) => (current.avg > best.avg ? current : best), { avg: 0 });

  // 2. Sortiere die Tabelle nach Total
  const sortedRows = allAirlines.sort((x, y) => y.pts - x.pts || y.exact - x.exact || x.code.localeCompare(y.code));

  // 3. Erzeuge die Tabellenzeilen mit der neuen "Avg"-Darstellung
  const trs = sortedRows.map((a, i) => {
    const avg = a.players > 0 ? (a.pts / a.players).toFixed(1) : "0.0";
    const totalCell = `
      <td class="total num">
        ${a.pts}
        <div style="font-size:11px; font-style:italic; font-weight:500; color:var(--mut); margin-top:1px;">⌀ ${avg}</div>
      </td>
    `;
    return `<tr>
        <td class="rank ${i < 3 ? ("p" + (i + 1)) : ""}">${i + 1}</td>
        <td class="player">
          <span style="display:inline-flex;align-items:center;gap:7px">
            ${tailHTML(a.code, 24)}
            <span>
              ${esc(TAIL_LABEL[a.code] || a.code)} 
              <span style="color:var(--mut);font-weight:600;font-size:13px">· ${a.players}</span>
            </span>
          </span>
        </td>
        <td class="stat num">${a.exact}</td>
        <td class="stat num">${a.pts - a.bonus}</td>
        <td class="stat num">${a.bonus}</td>
        ${totalCell}
      </tr>`;
  }).join("");

  // 4. Baue die Award-Karten und die gesamte HTML-Struktur zusammen
let awardsHTML = `<div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;">`;

  const bigOk = biggestFleet.pts > 0;
  awardsHTML += `<div class="prize" style="margin:0;"><div class="pmedal">🏆</div><div class="pinfo"><div class="pplace">Biggest Fleet</div><div class="pwin" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">${bigOk ? tailHTML(biggestFleet.code, 22) : ""}<span>${bigOk ? `${esc(TAIL_LABEL[biggestFleet.code])} · ${biggestFleet.pts} pts` : "—"}</span></div></div></div>`;

  const sharpOk = sharpestCrew.avg > 0;
  awardsHTML += `<div class="prize" style="margin:0;"><div class="pmedal">🎯</div><div class="pinfo"><div class="pplace">Sharpest Crew</div><div class="pwin" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">${sharpOk ? tailHTML(sharpestCrew.code, 22) : ""}<span>${sharpOk ? `${esc(TAIL_LABEL[sharpestCrew.code])} · ⌀ ${sharpestCrew.avg.toFixed(1)}` : "—"}</span></div></div></div>`;

  awardsHTML += `</div>`;

  return `
    <h3 style="font-family:'Anton',sans-serif;font-size:17px;letter-spacing:.3px;margin:16px 4px 4px">✈️ Airline Cup</h3>
    <div style="color:var(--mut);font-size:13px;margin:0 4px 10px;line-height:1.5">Each airline's crew points are pooled together. Which fleet will fly highest?</div>
    ${awardsHTML}
    <table class="rank-table">
      <colgroup><col class="col-rank"><col class="col-player"><col class="col-hit"><col class="col-points"><col class="col-bonus"><col class="col-total"></colgroup>
      <thead><tr><th class="rank-h">#</th><th class="player-h">Airline · Crew</th><th class="stat-h">Hits</th><th class="stat-h">Points</th><th class="stat-h">Bonus</th><th class="total-h">Total / Avg</th></tr></thead>
      <tbody>${trs}</tbody>
    </table>
  `;
}

function renderCrew(){
  const players=[...new Set([...tips.map(t=>t.player),...bonusAnswers.map(a=>a.player)])];
  const card=(medal,title,winner,sub,tailCode)=>`<div class="prize"><div class="pmedal">${medal}</div><div class="pinfo"><div class="pplace">${esc(title)}</div><div class="pwin" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">${winner&&tailCode?tailHTML(tailCode,22):""}<span>${winner?esc(winner):"—"}${sub?` · ${esc(sub)}`:""}</span></div></div></div>`;
  if(!players.length) return `<div class="rcard"><h3>OPSD Crew Lounge ✈️</h3><div class="lead">Fun team stats from everyone's picks. They appear as soon as the crew starts boarding — no predictions in yet.</div></div>`;

  const t=totals();
  const scored = matches.some(m=>m.finished)||bonusQs.some(q=>q.resolved);
  const fin=matches.filter(m=>m.finished);
  const sgn=x=>x>0?1:(x<0?-1:0);

  const cap=(t.length&&scored)?t[0]:null;

  const winQ=bonusQs.find(q=>/win the world cup/i.test(q.question))||bonusQs.find(q=>q.sort_order===1);
  let crowd=null;
  if(winQ){ const c={}; bonusAnswers.filter(a=>a.question_id===winQ.id).forEach(a=>{const k=(a.answer||"").trim();if(k)c[k]=(c[k]||0)+1;}); const top=Object.entries(c).sort((x,y)=>y[1]-x[1]||x[0].localeCompare(y[0]))[0]; const tot=Object.values(c).reduce((s,v)=>s+v,0); if(top) crowd={team:top[0],n:top[1],tot}; }

  let freq=null;
  players.forEach(name=>{ const n=tips.filter(x=>x.player===name).length; if(n>0&&(!freq||n>freq.n)) freq={name,n}; });

  let draw=null;
  players.forEach(name=>{ const n=tips.filter(x=>x.player===name&&x.home_tip!=null&&+x.home_tip===+x.away_tip).length; if(n>0&&(!draw||n>draw.n)) draw={name,n}; });

  let sky=null;
  const scorerQ=bonusQs.find(q=>/top scorer/i.test(q.question)&&q.qtype==="number")||bonusQs.find(q=>q.qtype==="number");
  if(scorerQ){ bonusAnswers.filter(a=>a.question_id===scorerQ.id).forEach(a=>{ const v=parseFloat(a.answer); if(!isNaN(v)&&(!sky||v>sky.v)) sky={name:a.player,v}; }); }

  let turb=null;
  players.forEach(name=>{ const ps=tips.filter(x=>x.player===name&&x.home_tip!=null); if(ps.length){ const avg=ps.reduce((s,x)=>s+(+x.home_tip+ +x.away_tip),0)/ps.length; if(!turb||avg>turb.avg) turb={name,avg}; } });

  let greaser=null;
  t.forEach(p=>{ if(p.exact>0&&(!greaser||p.exact>greaser.exact)) greaser={name:p.name,exact:p.exact}; });

  let go=null;
  players.forEach(name=>{ let n=0; fin.forEach(m=>{ const tp=tips.find(x=>x.player===name&&x.match_id===m.id); if(!tp||tp.home_tip==null) return; const ph=+tp.home_tip,pa=+tp.away_tip,rh=+m.home_score,ra=+m.away_score; if(sgn(ph-pa)===sgn(rh-ra)&&(Math.abs(ph-rh)+Math.abs(pa-ra))===1) n++; }); if(n>0&&(!go||n>go.n)) go={name,n}; });

  let dayCap=null;
  if(fin.length){ players.forEach(name=>{ const byDay={}; fin.forEach(m=>{ const tp=tips.find(x=>x.player===name&&x.match_id===m.id); const s=scoreOf(tp,m); if(s!=null){ const d=m.match_date||"?"; byDay[d]=(byDay[d]||0)+s; } }); const best=Math.max(0,...Object.values(byDay)); if(best>0&&(!dayCap||best>dayCap.pts)) dayCap={name,pts:best}; }); }

  const finSorted=fin.slice().sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
  let auto=null;
  players.forEach(name=>{ let cur=0,best=0; finSorted.forEach(m=>{ const tp=tips.find(x=>x.player===name&&x.match_id===m.id); const s=scoreOf(tp,m); if(s!=null&&s>0){cur++;best=Math.max(best,cur);}else{cur=0;} }); if(best>0&&(!auto||best>auto.best)) auto={name,best}; });

  let html=`<div class="rcard"><h3>OPSD Crew Lounge ✈️</h3><div class="lead">Fun team stats from everyone's picks — just for bragging rights. They fill in as more predictions and results come in.</div></div>`;
  html+=renderAirlineStandings();
  html+=card("🧑‍✈️","Captain (current #1)", cap?cap.name:null, cap?`${cap.pts} pts`:"no scores yet", cap?tailOf(cap.name):null);
  html+=card("🏆","Crowd Favourite", crowd?crowd.team:null, crowd?`backed by ${crowd.n}/${crowd.tot}`:"no winner picks yet", null);
  html+=card("✈️","Frequent Flyer", freq?freq.name:null, freq?`${freq.n} tips submitted`:"no tips yet", freq?tailOf(freq.name):null);
  html+=card("🔁","Holding Pattern", draw?draw.name:null, draw?`${draw.n} draws predicted`:"no draws yet", draw?tailOf(draw.name):null);
  html+=card("🚀","Sky's the Limit", sky?sky.name:null, sky?`top scorer for ${sky.v} goals`:"no bonus answers yet", sky?tailOf(sky.name):null);
  html+=card("🌪️","Turbulence Seeker", turb?turb.name:null, turb?`${turb.avg.toFixed(1)} goals/match on average`:"no picks yet", turb?tailOf(turb.name):null);
  html+=card("🎯","Greaser (most exact)", greaser?greaser.name:null, greaser?`${greaser.exact} perfect landings`:"fills once matches are scored", greaser?tailOf(greaser.name):null);
  html+=card("😬","Go-Around (so close!)", go?go.name:null, go?`${go.n}× just 1 goal off`:"fills once matches are scored", go?tailOf(go.name):null);
  html+=card("📅","Day Captain", dayCap?dayCap.name:null, dayCap?`${dayCap.pts} pts in one matchday`:"fills once matches are scored", dayCap?tailOf(dayCap.name):null);
  html+=card("🛩️","Autopilot (hot streak)", auto?auto.name:null, auto?`${auto.best} scoring tips in a row`:"fills once matches are scored", auto?tailOf(auto.name):null);
  return html;
}
function renderRules(){ const g=SCORE.group,k=SCORE.knockout; return `<div class="rcard"><h3>How it works ✈️</h3><div class="lead">Two deadlines — don't mix them up:</div><div class="rrow"><span class="pp">✈️</span><span><b>Upgrades</b> (bonus questions): answer them <b>all once, before the very first match</b> of the tournament kicks off. After that they lock for good.</span></div><div class="rrow"><span class="pp">🛫</span><span><b>Departures</b> (match scores): predicted <b>one match at a time</b> — each game locks <b>5 min before its own kickoff</b>, so keep coming back all tournament long.</span></div><div class="rrow"><span class="pp">🍫</span><span>Points stack up on the <b>Flight Deck</b>; the top 3 win SWISS Schoki (see <b>Cargo</b>).</span></div></div><div class="rcard"><h3>Good to know 👍</h3><div class="lead">A few details that win — or cost — you points.</div><div class="rrow"><span class="pp">🥅</span><span>For knockout games, predict the score <b>after 120 minutes</b> (extra time counts, penalty-shootout goals do <b>not</b>). A 1:1 thriller that goes to penalties is scored as 1:1.</span></div> <div class="rrow"><span class="pp">🧑</span><span>Enter your name to play — and write it the same way every time. Capitalization doesn't matter (andreas = Andreas = ANDREAS), but spelling does: "Andi", "Andreas" and "Andreas M." are three different humans to the Flight Deck.</span></div> </div><div class="rcard"><h3>Points · Group stage</h3><div class="lead">Only the single best tier counts — no stacking. First the outcome (home win / draw / away win) must be right, otherwise 0.</div><div class="rrow"><span class="pp">${g.exact} pts</span><span>🎯 <b>Exact score.</b></span></div><div class="rrow"><span class="pp">${g.diff} pts</span><span>➖ Right winner <b>and</b> right goal difference — e.g. you tip 3:2 and it ends 2:1. <b>Draw:</b> a draw one goal off (0:0 or 2:2 for a 1:1).</span></div><div class="rrow"><span class="pp">${g.tendency} pts</span><span>✅ Right winner only, wrong margin. <b>Draw:</b> a draw further off (3:3 for a 1:1).</span></div><div class="rmax">🎯 Nail the exact score = ${maxPts({phase:"Group"})} points.</div></div><div class="rcard"><h3>Points · Knockout stage</h3><div class="lead">Same idea, double the drama — every tier is worth twice as much (scored after 120').</div><div class="rrow ko"><span class="pp">${k.exact} pts</span><span>🎯 Exact score.</span></div><div class="rrow ko"><span class="pp">${k.diff} pts</span><span>➖ Right winner + right goal difference (draw: one goal off).</span></div><div class="rrow ko"><span class="pp">${k.tendency} pts</span><span>✅ Right winner only (draw: further off).</span></div><div class="rmax">🎯 Nail the exact score = ${maxPts({phase:"Knockout"})} points.</div></div></div>`; }
function renderPrizes(){

  <div class="prize gold"><div class="pmedal">🥇</div><div class="pinfo"><div class="pplace">1st place</div><div class="pwin">3× SWISS Schoki</div></div><div class="pcount">🍫🍫🍫</div></div>

function renderAdmin(){
  if(!adminOK) return `<div class="panel"><h3>Control Tower</h3><div class="field"><label>Access code</label><input id="apw" type="password" placeholder="Tower password"></div><button class="btn" id="alogin">Enter tower</button></div>`;
  const phases=["Group","Round of 32","Round of 16","Quarter-final","Semi-final","Third place","Final"];
  const mlist=matches.map(m=>`<div class="adminmatch" data-am="${m.id}">
      <span class="nm">${flagHTML(m.home)} ${esc(m.home)} – ${esc(m.away)} ${flagHTML(m.away)} <span style="color:var(--mut)">(${esc(m.match_date)})</span></span>
      <input type="number" min="0" data-side="hs" value="${m.home_score??""}" placeholder="–"><span style="color:var(--mut)">:</span><input type="number" min="0" data-side="as" value="${m.away_score??""}" placeholder="–">
      <button class="btn sm ghost" data-lock="${m.id}">${m.locked?"🔒":"🔓"}</button>
      <button class="btn sm ${m.finished?"ghost":""}" data-fin="${m.id}">${m.finished?"scored ✓":"score"}</button>
      <button class="btn ghost sm" data-del="${m.id}">✕</button></div>`).join("");
  const bqlist=bonusQs.map(q=>{
    let setter;
    if(q.qtype==="choice"){
      const opts=(()=>{try{return JSON.parse(q.options||"[]")}catch(e){return[]}})();
      setter=`<select data-bc="${q.id}"><option value="">– correct –</option>${opts.map(o=>`<option ${q.correct===o?"selected":""}>${esc(o)}</option>`).join("")}</select>`;
    } else {
      setter=`<input type="${q.qtype==="number"?"number":"text"}" data-bc="${q.id}" value="${esc(q.correct??"")}" placeholder="correct answer" style="width:auto;flex:1;min-width:110px;text-align:left">`;
    }
    return `<div class="adminbq" data-aq="${q.id}"><div class="qx">${esc(q.question)} <span class="tag">${q.qtype}</span><span class="tag">${q.points} pts</span></div>
      <div class="ctrl">${setter}<button class="btn sm ghost" data-block="${q.id}">${q.locked?"🔒":"🔓"}</button><button class="btn sm ${q.resolved?"ghost":""}" data-bres="${q.id}">${q.resolved?"resolved ✓":"resolve"}</button><button class="btn ghost sm" data-bdel="${q.id}">✕</button></div></div>`;
  }).join("");
  return `
    <div class="panel"><h3>Add match</h3>
      <div class="grid2">
        <div class="field"><label>Home</label><input id="nh" placeholder="e.g. Switzerland"></div>
        <div class="field"><label>Away</label><input id="na" placeholder="e.g. Qatar"></div>
        <div class="field"><label>Date</label><input id="nd" placeholder="Sat 13 Jun"></div>
        <div class="field"><label>Time</label><input id="nt" placeholder="21:00"></div>
        <div class="field"><label>Phase</label><select id="np">${phases.map(p=>`<option>${p}</option>`).join("")}</select></div>
        <div class="field"><label>Group (group stage only)</label><input id="ng" placeholder="A" maxlength="2"></div>
        <div class="field" style="grid-column:1/-1"><label>Kickoff — local time (enables auto-lock 5 min before)</label><input id="nk" type="datetime-local"></div>
      </div><button class="btn" id="addMatch">Add match</button>
      <div class="hint" style="margin-top:8px">Tip: type the country in English or German — flags are detected automatically.</div></div>

    <div class="panel"><h3>Flight control</h3>${mlist||'<div class="hint">No matches.</div>'}
      <div class="hint" style="margin-top:12px">Gate closed blocks predictions before kickoff. Mark scored once the official final score is confirmed.</div></div>

    <div class="panel"><h3>Add bonus question</h3>
      <div class="field"><label>Question</label><input id="bq" placeholder="e.g. Who will win the World Cup?"></div>
      <div class="grid2">
        <div class="field"><label>Type</label><select id="bt"><option value="text">Free text</option><option value="number">Number (closest wins)</option><option value="choice">Multiple choice</option></select></div>
        <div class="field"><label>Points</label><input id="bp" type="number" value="5"></div>
      </div>
      <div class="field"><label>Options (choice only, comma-separated)</label><input id="bo" placeholder="Yes, No"></div>
      <button class="btn" id="addBonus">Add bonus question</button>
      <div class="hint" style="margin-top:8px">Enter the correct answer below once it's known, then hit "resolve" to award points.</div></div>

    <div class="panel"><h3>Bonus questions</h3>${bqlist||'<div class="hint">No bonus questions yet.</div>'}</div>

    <div class="panel"><h3>Scoring (summary)</h3><div class="rules">
      Best tier only — Group: exact <b>${SCORE.group.exact}</b> · right difference <b>${SCORE.group.diff}</b> · right winner <b>${SCORE.group.tendency}</b>.<br>
      Knockout (doubled): exact <b>${SCORE.knockout.exact}</b> · right difference <b>${SCORE.knockout.diff}</b> · right winner <b>${SCORE.knockout.tendency}</b>.<br>
      Full rules are on the <b>Bordkarte</b> tab.</div></div>

    <div class="panel"><h3>Flight Manifest (export standings)</h3>
      <div class="rules" style="margin-bottom:10px">Generate the current Flight Deck as CSV — copy it or download for the records.</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="genManifest">Generate</button><button class="btn ghost" id="dlManifest">Download .csv</button></div>
      <textarea id="manifestOut" readonly placeholder="Press Generate…" style="width:100%;margin-top:10px;min-height:120px;border:1px solid var(--line);border-radius:9px;padding:10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px"></textarea></div>`;
}
function renderView(){
  const view=$("#view");
  const tabMap={tip:renderTip,bonus:renderBonus,rank:renderRank,crew:renderCrew,prizes:renderPrizes,rules:renderRules,admin:renderAdmin};
  view.innerHTML=tabMap[tab]();
  renderMe(); // <-- DIESE ZEILE HIER EINFÜGEN!
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  tab = b.dataset.tab;
  window.location.hash = tab; // <-- DIESE ZEILE HINZUFÜGEN (ändert die URL auf #tab-name)
  renderView();
});

  // Departures: save + round switcher
  const saveTipsBtn=document.getElementById("saveTips");
  if(saveTipsBtn) saveTipsBtn.onclick=saveTips;
  document.querySelectorAll(".js-savetips").forEach(b=>b.onclick=saveTips);
  document.querySelectorAll("[data-rnd]").forEach(btn=>btn.onclick=()=>{tipRound=btn.dataset.rnd;renderView();});

  // Upgrades: save
  const saveBonusBtn=document.getElementById("saveBonus");
  if(saveBonusBtn) saveBonusBtn.onclick=saveBonus;

  // Control Tower: login
// ... Innerhalb von renderView() ...
if(tab==="admin"&&!adminOK){
  const b=document.getElementById("alogin");
  if(b){
    b.onclick=()=>{ if(btoa(document.getElementById("apw").value)===ADMIN_PW){adminOK=true;renderView();} else toast("Wrong password"); };
    document.getElementById("apw").onkeydown=e=>{ if(e.key==="Enter") b.click(); };
  }
}



  // Control Tower: admin actions
  if(tab==="admin"&&adminOK){
    const addM=document.getElementById("addMatch");
    if(addM) addM.onclick=async()=>{
      const h=document.getElementById("nh").value.trim(), a=document.getElementById("na").value.trim();
      if(!h||!a){toast("Enter home and away");return;}
      let dd=document.getElementById("nd").value.trim(), tt=document.getElementById("nt").value.trim(), kickoff=null;
      const kv=document.getElementById("nk").value;
      if(kv){ const d=new Date(kv); if(!isNaN(d)){ kickoff=d.toISOString(); if(!dd) dd=d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"}); if(!tt) tt=d.toTimeString().slice(0,5); } }
      const order=(matches.reduce((mx,x)=>Math.max(mx,x.sort_order||0),0))+1;
      const {error}=await sb.from("matches").insert([{phase:document.getElementById("np").value,grp:document.getElementById("ng").value.trim()||null,match_date:dd||"TBD",match_time:tt||"—",kickoff,home:h,away:a,sort_order:order}]);
      if(error){toast("Error");return;}
      await loadAll();toast("Match added");
    };
    document.querySelectorAll('[data-fin]').forEach(btn=>btn.onclick=async()=>{
      const id=+btn.dataset.fin, row=btn.closest('[data-am]'), m=matches.find(x=>x.id===id);
      if(!m.finished){
        const hs=row.querySelector('[data-side=hs]').value, as=row.querySelector('[data-side=as]').value;
        if(hs===""||as===""){toast("Enter the result");return;}
        await sb.from("matches").update({home_score:+hs,away_score:+as,finished:true,locked:true}).eq("id",id);
      } else {
        await sb.from("matches").update({finished:false}).eq("id",id);
      }
      await loadAll();
    });
    document.querySelectorAll('[data-lock]').forEach(btn=>btn.onclick=async()=>{
      const id=+btn.dataset.lock, m=matches.find(x=>x.id===id);
      await sb.from("matches").update({locked:!m.locked}).eq("id",id);
      await loadAll();
    });
    document.querySelectorAll('[data-del]').forEach(btn=>btn.onclick=async()=>{
      if(!confirm("Delete match?"))return;
      await sb.from("matches").delete().eq("id",+btn.dataset.del);
      await loadAll();
    });
    const ab=document.getElementById("addBonus");
    if(ab) ab.onclick=async()=>{
      const q=document.getElementById("bq").value.trim();
      if(!q){toast("Enter a question");return;}
      const type=document.getElementById("bt").value;
      const pts=+document.getElementById("bp").value||5;
      let options=null;
      if(type==="choice"){
        const arr=document.getElementById("bo").value.split(",").map(s=>s.trim()).filter(Boolean);
        if(arr.length<2){toast("Choice needs ≥2 options");return;}
        options=JSON.stringify(arr);
      }
      const order=(bonusQs.reduce((mx,x)=>Math.max(mx,x.sort_order||0),0))+1;
      const {error}=await sb.from("bonus_questions").insert([{question:q,qtype:type,options,points:pts,sort_order:order}]);
      if(error){toast("Error");return;}
      await loadAll();toast("Bonus question added");
    };
    document.querySelectorAll('[data-bres]').forEach(btn=>btn.onclick=async()=>{
      const id=+btn.dataset.bres, q=bonusQs.find(x=>x.id===id), row=btn.closest('[data-aq]');
      if(!q.resolved){
        const v=String(row.querySelector('[data-bc]').value).trim();
        if(v===""){toast("Enter the correct answer");return;}
        await sb.from("bonus_questions").update({correct:v,resolved:true,locked:true}).eq("id",id);
      } else {
        await sb.from("bonus_questions").update({resolved:false}).eq("id",id);
      }
      await loadAll();
    });
    document.querySelectorAll('[data-block]').forEach(btn=>btn.onclick=async()=>{
      const id=+btn.dataset.block, q=bonusQs.find(x=>x.id===id);
      await sb.from("bonus_questions").update({locked:!q.locked}).eq("id",id);
      await loadAll();
    });
    document.querySelectorAll('[data-bdel]').forEach(btn=>btn.onclick=async()=>{
      if(!confirm("Delete bonus question?"))return;
      await sb.from("bonus_questions").delete().eq("id",+btn.dataset.bdel);
      await loadAll();
    });
    const buildManifest=()=>{ const t=totals(); const lines=["Rank,Player,Hits,Bonus,Total"]; t.forEach((p,i)=>lines.push(`${i+1},"${String(p.name).replace(/"/g,'""')}",${p.exact},${p.bonus},${p.pts}`)); return lines.join("\n"); };
    const gm=document.getElementById("genManifest");
    if(gm) gm.onclick=()=>{ const out=document.getElementById("manifestOut"); out.value=buildManifest(); toast("Manifest generated"); };
    const dm=document.getElementById("dlManifest");
    if(dm) dm.onclick=()=>{ const csv=buildManifest(); const blob=new Blob([csv],{type:"text/csv"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`opsd-flight-deck-${todayKey()}.csv`; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(a.href); };
  }
}

// Öffnet und schliesst das Feedback-Popup
function toggleCabinLog() {
  const modal = document.getElementById("cabinLogModal");
  if (modal.style.display === "block") {
    modal.style.display = "none";
  } else {
    modal.style.display = "block";
    document.getElementById("cabinLogText").value = "";
    document.getElementById("cabinLogText").focus();
  }
}

// Sendet die Nachricht anonym an Supabase
async function sendCabinLog() {
  const txt = document.getElementById("cabinLogText").value.trim();
  if (!txt) {
    toast("Please enter a message.");
    return;
  }
  
  // Sendet den Text an deine neue Supabase-Tabelle "feedback"
  const { error } = await sb.from("feedback").insert([{ message: txt }]);
  
  if (error) {
    toast("Could not submit log entry. Sorry!");
  } else {
    toast("Log entry submitted! Thank you 🙏");
    document.getElementById("cabinLogModal").style.display = "none";
  }
}

window.addEventListener("hashchange", () => {
  const h = window.location.hash.replace("#", "");
  if (validTabs.includes(h) && tab !== h) {
    tab = h;
    renderView();
  }
});
