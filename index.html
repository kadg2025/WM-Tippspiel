async function loadAll(){
  if(!sb){ $("#view").innerHTML=`<div class="empty">⚠️ Supabase is not configured.</div>`; renderMe(); return; }
  const [m,t,bq,ba]=await Promise.all([
    sb.from("matches").select("*").order("sort_order",{ascending:true}).order("id",{ascending:true}),
    sb.from("tips").select("*"),
    sb.from("bonus_questions").select("*").order("sort_order",{ascending:true}).order("id",{ascending:true}),
    sb.from("bonus_answers").select("*")
  ]);
  if(m.error||t.error){ $("#view").innerHTML=`<div class="empty">Could not load data. Check the URL/key and that the SQL setup ran.</div>`; return; }

function scoreOf(pick,m){
  if(!pick||!m||!m.finished||m.home_score==null||m.away_score==null) return null;
  const ph=+pick.home_tip,pa=+pick.away_tip,rh=+m.home_score,ra=+m.away_score;
  const S=(m.phase==="Group")?SCORE.group:SCORE.knockout;
  let pts=0;
  if(Math.sign(ph-pa)===Math.sign(rh-ra)) pts+=S.tendency;
  if(ph===rh) pts+=S.home;
  if(pa===ra) pts+=S.away;
  if(ph-pa===rh-ra) pts+=S.diff;
  return pts;
}
function isExactHit(pick,m){ return pick&&m&&m.finished&&+pick.home_tip===+m.home_score&&+pick.away_tip===+m.away_score; }
function maxPts(m){ const S=(m.phase==="Group")?SCORE.group:SCORE.knockout; return S.tendency+S.home+S.away+S.diff; }
function isClosed(m){
  if(m.finished||m.locked) return true;
  if(m.kickoff){ const k=new Date(m.kickoff).getTime(); if(!isNaN(k)&&Date.now()>=k-5*60*1000) return true; }
  return false;
}
function statusBanner(m){
  if(m.finished) return `<div class="hint" style="margin:8px 0 0">✅ Final score confirmed</div>`;
  if(!m.kickoff) return "";
  const ms = new Date(m.kickoff).getTime() - Date.now();
  if(isNaN(ms)) return "";
  const min = Math.floor(ms/60000);
  if(min < 0) return `<div class="hint" style="margin:8px 0 0;color:#b45309;font-weight:700">🛑 Gate closed</div>`;
  if(min <= 15) return `<div class="hint" style="margin:8px 0 0;color:#b45309;font-weight:700">⏳ Gate closes in ${min} min</div>`;
  if(min <= 60) return `<div class="hint" style="margin:8px 0 0;color:var(--accent);font-weight:700">🛫 Boarding soon</div>`;
  return "";
}
function myPick(id){ return tips.find(x=>x.player===me&&x.match_id===id); }

function bonusEarned(q,player){
  if(!q.resolved||q.correct==null||q.correct==="") return null;
  const a=bonusAnswers.find(x=>x.question_id===q.id&&x.player===player);
  if(!a) return 0;
  if(q.qtype==="number"){
    const target=parseFloat(q.correct);
    const diffs=bonusAnswers.filter(x=>x.question_id===q.id).map(x=>{const n=parseFloat(x.answer);return isNaN(n)?Infinity:Math.abs(n-target);});
    const best=Math.min(...diffs);
    const mine=parseFloat(a.answer), myd=isNaN(mine)?Infinity:Math.abs(mine-target);
    return (myd===best&&best!==Infinity)?q.points:0;
  }
  return (String(a.answer).trim().toLowerCase()===String(q.correct).trim().toLowerCase())?q.points:0;
}

function todayKey(d=new Date()){
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,"0");
  const day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function matchDateKey(m){
  if(m && m.kickoff){
    const d=new Date(m.kickoff);
    if(!isNaN(d)) return todayKey(d);
  }
  return null;
}
function todaysMatches(){
  const key=todayKey();
  return matches.filter(m=>matchDateKey(m)===key);
}
function autoOpsNews(){
const today=todaysMatches();
  for(const m of today){
    const msg=OPS_TEAM_MESSAGES[m.home]||OPS_TEAM_MESSAGES[m.away];
    if(msg) return msg;
  }
  const openToday=today.filter(m=>!isClosed(m));
  if(openToday.length===1){
    const m=openToday[0];
    return `${m.home} vs. ${m.away} tonight — predictions are open.`;
  }
  if(openToday.length>1){
    return `${openToday.length} matches on today's board — don't miss the cutoff.`;
  }
  const scored=matches.filter(m=>m.finished).length;
  if(scored>0) return `Flight Deck live: ${scored} scored match${scored===1?"":"es"} already counted.`;
  return "Predictions are open — pick your scores before boarding closes.";
}
function currentOpsNews(){
  if(opsNewsMode==="custom" && opsNewsCustom.trim()) return opsNewsCustom.trim();
  if(opsNewsMode==="preset" && opsNewsPreset.trim()) return opsNewsPreset.trim();
  return autoOpsNews();
}
function renderOpsLine(){
  const msg=currentOpsNews();
  return msg?`<div class="opsline"><span class="label">OPS news</span>${esc(msg)}</div>`:"";
}

function totals(){
  const players=new Set();
  tips.forEach(t=>players.add(t.player));
  bonusAnswers.forEach(a=>players.add(a.player));
  return [...players].map(name=>{
    let pts=0,exact=0,bonus=0;
    tips.filter(t=>t.player===name).forEach(t=>{
      const m=matches.find(x=>x.id===t.match_id);
      const s=scoreOf(t,m);
      if(s!=null){pts+=s;if(isExactHit(t,m))exact++;}
    });
    bonusQs.forEach(q=>{const e=bonusEarned(q,name);if(e){pts+=e;bonus+=e;}});
    return {name,pts,exact,bonus};
  }).sort((a,b)=> b.pts-a.pts || b.exact-a.exact || a.name.localeCompare(b.name));
}

function allPicksHTML(matchId,rHome,rAway,finished){
  const mt=tips.filter(t=>t.match_id===matchId);
  if(!mt.length) return '<div class="all-picks"><span style="font-size:12px;color:var(--mut)">No picks yet</span></div>';
  const chips=mt.map(t=>{
    const isMe=t.player===me;
    let cls="pick-chip";
    if(finished&&rHome!=null){
      const exact=+t.home_tip===+rHome&&+t.away_tip===+rAway;
      const good=!exact&&Math.sign(+t.home_tip-+t.away_tip)===Math.sign(+rHome-+rAway);
      if(exact) cls+=" exact"; else if(good) cls+=" good";
    }
    if(isMe) cls+=" me";
    return `<span class="${cls}">${esc(t.player)} ${t.home_tip}:${t.away_tip}</span>`;
  }).join("");
  return `<div class="all-picks">${chips}</div>`;
}
function toggleReveal(id,btn){
  const el=document.getElementById('rev-'+id);
  if(!el) return;

  el.style.display=hidden?"block":"none";
  btn.textContent=hidden?"👀 Hide picks":"👀 Show all picks";

function matchCard(m){
  const pick=myPick(m.id)||{};
  const closed=isClosed(m);
  const head=`<div class="meta"><span class="grp">${m.phase==="Group"?("Group "+(m.grp||"")):esc(m.phase)}</span><span>${esc(m.match_date)} · ${esc(m.match_time)}${closed&&!m.finished?" · 🛑 Gate closed":""}</span></div>`;

  if(m.finished){
    const s=scoreOf(pick,m),has=pick.home_tip!=null;
    return `<div class="match">${head}
      <div class="teams">
        <div class="team">${flagHTML(m.home)}<span class="tname">${esc(m.home)}</span></div>
        <div class="result"><span class="lbl">Full time</span><span class="final num">${m.home_score}:${m.away_score}</span></div>
        <div class="team away">${flagHTML(m.away)}<span class="tname">${esc(m.away)}</span></div>
      </div>
      ${statusBanner(m)}
      <div class="pts"><span>Your pick: <b class="num">${has?pick.home_tip+":"+pick.away_tip:"—"}</b></span>
        ${has?`<span class="pill ${s===0?"zero":""}">${s} pts</span>`:`<span class="locked">no pick</span>`}</div>
      ${allPicksHTML(m.id,m.home_score,m.away_score,true)}</div>`;
  }

  const dis=closed?"disabled":"";
  const revealSection=closed?`
    <button class="reveal-toggle" onclick="toggleReveal(${m.id},this)">👀 Show all picks</button>
    <div id="rev-${m.id}" style="display:none">${allPicksHTML(m.id,null,null,false)}</div>`:"";

  return `<div class="match" data-m="${m.id}">${head}
    <div class="teams">
      <div class="team">${flagHTML(m.home)}<span class="tname">${esc(m.home)}</span></div>
      <div class="score">
        <input type="number" min="0" max="99" class="num" data-side="h" value="${pick.home_tip??""}" ${dis} oninput="if(this.value!==''&&+this.value<0)this.value=0">
        <span class="sep">:</span>
        <input type="number" min="0" max="99" class="num" data-side="a" value="${pick.away_tip??""}" ${dis} oninput="if(this.value!==''&&+this.value<0)this.value=0">
      </div>
      <div class="team away">${flagHTML(m.away)}<span class="tname">${esc(m.away)}</span></div>
    </div>
    ${statusBanner(m)}
    ${revealSection}</div>`;
}

function renderTip(){
  if(!matches.length) return `<div class="empty">No matches yet. Add them in the <b>Control Tower</b> tab.</div>`;
  if(!me) return `<div class="hint" style="text-align:center;margin-top:20px">Enter your name above to start predicting.</div>`;

  const groupMatches=matches.filter(m=>m.phase==="Group");
  const rounds=[...new Set(groupMatches.map(m=>m.round).filter(Boolean))].sort();
  const hasRounds=rounds.length>0;
  const koMatches=matches.filter(m=>m.phase!=="Group");
  if(koMatches.length) rounds.push("Knockout");
  if(hasRounds&&!rounds.includes(tipRound)) tipRound=rounds[0]||"Round 1";

  function roundDot(rnd){
    const rm=rnd==="Knockout"?koMatches:matches.filter(m=>m.round===rnd);
    const open=rm.filter(m=>!isClosed(m));
    const picked=open.filter(m=>{const p=myPick(m.id);return p&&p.home_tip!=null;});
    if(open.length===0) return "#aab2ad";
    if(picked.length===open.length) return "#16a34a";
    if(picked.length>0) return "#f4b400";
    return "#e6eae8";
  }

  let nav=`<div class="round-nav" id="roundNav">`;
  rounds.forEach(r=>{
    nav+=`<button class="${r===tipRound?"on":""}" data-rnd="${esc(r)}"><span class="rdot" style="background:${roundDot(r)}"></span>${esc(r)}</button>`;
  });
  nav+=`</div>`;

  const visible=tipRound==="Knockout"?koMatches:matches.filter(m=>m.round===tipRound);
  const fallback=!hasRounds?matches:visible;

  let html="",last="";
  fallback.forEach(m=>{
    if(m.match_date!==last){html+=`<div class="day">${esc(m.match_date)}</div>`;last=m.match_date;}
    html+=matchCard(m);
  });

  const open=fallback.filter(m=>!isClosed(m));
  const filled=open.filter(m=>{const p=myPick(m.id);return p&&p.home_tip!=null;});
  const progress=open.length?`<div class="hint" style="margin-bottom:10px">📝 ${filled.length}/${open.length} picks entered for this round</div>`:"";
  const saveBtn=fallback.some(m=>!isClosed(m))?`<button class="btn" id="saveTips" style="width:100%;padding:14px;margin-top:8px">Save predictions</button>`:"";

  return (hasRounds?nav:"")+renderOpsLine()+progress+html+saveBtn;
}

async function saveTips(){
  const rows = [];
  let missing = false;
  let invalid = false;

  [...document.querySelectorAll(".match[data-m]")].forEach(c=>{
    const id = +c.dataset.m;
    const m = matches.find(x=>x.id===id);
    if(!m || isClosed(m)) return;

    const hEl = c.querySelector('[data-side="h"]');
    const aEl = c.querySelector('[data-side="a"]');
    const hRaw = hEl ? hEl.value.trim() : "";
    const aRaw = aEl ? aEl.value.trim() : "";

    if(hRaw === "" && aRaw === "") return;
    if(hRaw === "" || aRaw === ""){ missing = true; return; }

    const h = Number(hRaw);
    const a = Number(aRaw);
    if(!Number.isFinite(h) || !Number.isFinite(a) || h < 0 || a < 0){ invalid = true; return; }

    rows.push({ player: me, match_id: id, home_tip: Math.round(h), away_tip: Math.round(a) });
  });

  if(missing){ toast("Please enter both home and away goals."); return; }
  if(invalid){ toast("Goals must be 0 or higher."); return; }
  if(!rows.length){ toast("Nothing to save yet."); return; }

  const { error } = await sb.from("tips").upsert(rows, { onConflict: "player,match_id" });
  if(error){ toast("Save failed."); return; }
  await loadAll();
  toast("Predictions saved.");
}

function bonusCard(q){
  const a=bonusAnswers.find(x=>x.question_id===q.id&&x.player===me);
  const myVal=a?a.answer:"";
  const meta=`<div class="meta"><span>${q.points} pts ${q.qtype==="number"?"· closest wins":""}</span><span>${q.resolved?"✅ resolved":(q.locked?"🔒 closed":"open")}</span></div>`;
  let control="";
  if(q.resolved||q.locked){
    control=`<input type="text" value="${esc(myVal||"—")}" disabled>`;
  }else if(q.qtype==="choice"){
    const opts=(()=>{try{return JSON.parse(q.options||"[]")}catch(e){return[]}})();
    control=`<select data-q="${q.id}"><option value="">Choose…</option>${opts.map(o=>`<option ${myVal===o?"selected":""}>${esc(o)}</option>`).join("")}</select>`;
  }else if(q.qtype==="number"){
    control=`<input type="number" data-q="${q.id}" value="${esc(myVal)}" placeholder="Your number">`;
  }else{
    control=`<input type="text" data-q="${q.id}" value="${esc(myVal)}" placeholder="Your answer">`;
  }
  let footer="";
  if(q.resolved){
    const e=bonusEarned(q,me);
    footer=`<div class="correct"><span>Correct: <b>${esc(q.correct)}</b></span>${a?`<span class="pill ${e?"":"zero"}">${e||0} pts</span>`:`<span class="locked">no answer</span>`}</div>`;
  }
  return `<div class="bonus">${meta}<div class="q">${esc(q.question)}</div>${control}${footer}</div>`;
}
function renderBonus(){
  if(!me) return `<div class="hint" style="text-align:center;margin-top:20px">Enter your name above to play the bonus round.</div>`;
  if(!bonusQs.length) return `<div class="empty">No bonus questions yet.<br>Big-picture predictions for the whole tournament will appear here. 🎲</div>`;
  let html=`<div class="hint">🎲 Tournament-long predictions. High risk, high reward — these can decide the whole pool.</div>`;
  html+=bonusQs.map(bonusCard).join("");
  if(bonusQs.some(q=>!q.resolved&&!q.locked)) html+=`<button class="btn gold" id="saveBonus" style="width:100%;padding:14px;margin-top:8px;color:#1a1a1a">Save bonus answers</button>`;
  return html;
}
async function saveBonus(){
  const rows=[];
  document.querySelectorAll('[data-q]').forEach(el=>{
    const id=+el.dataset.q;
    const v=String(el.value).trim();
    if(v!=="") rows.push({player:me,question_id:id,answer:v});
  });
  if(!rows.length){toast("Nothing to save yet");return;}
  const {error}=await sb.from("bonus_answers").upsert(rows,{onConflict:"player,question_id"});
  if(error){toast("Save failed");return;}
  await loadAll();toast("Bonus answers saved ✓");
}

function renderRank(){
  const t = totals();
  if(!t.length){
    return `<div class="empty">No predictions yet.<br>Be the first — the Flight Deck is waiting.</div>`;
  }

  const anyScored = matches.some(m=>m.finished) || bonusQs.some(q=>q.resolved);
  let podium = "";
  if(t.length >= 3){
    const p = t.slice(0,3);
    const order = [p[1], p[0], p[2]].filter(Boolean);
    const cls = ["second","first","third"];
    const med = ["🥈","🥇","🥉"];
    podium = `<div class="podium">${order.map((pl,i)=>`
      <div class="pod ${cls[i]}">
        <div class="medal">${med[i]}</div>
        <div class="pname">${esc(pl.name)}</div>
        <div class="ppts num">${pl.pts} pts</div>
      </div>`).join("")}</div>`;
  }

  const rows = t.map((p,i)=>{
    const r = i + 1;
    const rankCls = r <= 3 ? `p${r}` : "";
    return `
      <tr class="${p.name===me ? "me-row" : ""}">
        <td class="rank ${rankCls}">${r}</td>
        <td class="player">${esc(p.name)}${p.name===me ? `<span class="you-tag">(you)</span>` : ``}</td>
        <td class="stat num">${p.exact}</td>
        <td class="stat num">${p.bonus}</td>
        <td class="total num">${p.pts}</td>
      </tr>`;
  }).join("");

  if(me && t.length && t[0].name === me){ if(_lastRank1 !== me){ _lastRank1 = me; setTimeout(fireConfetti, 200); } } else { _lastRank1 = null; }

  return `${podium}${!anyScored ? `<div class="hint">The Flight Deck fills up once matches are scored or bonus questions are resolved.</div>` : ``}
    <table class="rank-table">
      <colgroup><col class="col-rank"><col class="col-player"><col class="col-hit"><col class="col-bonus"><col class="col-total"></colgroup>
      <thead><tr><th class="rank-h">#</th><th class="player-h">Player</th><th class="stat-h" title="Correct exact scores">🎯 Hits</th><th class="stat-h" title="Bonus question points">Bonus</th><th class="total-h">Total</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

  const tiers=[{medal:"🥇",place:"1st place",n:3,cls:"gold"},{medal:"🥈",place:"2nd place",n:2,cls:""},{medal:"🥉",place:"3rd place",n:1,cls:""}];
  return `<div class="prizehero"><img src="${PRIZE_IMG}" alt="SWISS Schoki"><div><div class="ph-title">SWISS Schoki 🍫</div><div class="ph-sub">The legendary in-flight chocolate — glory you can actually eat.</div></div></div>
    ${tiers.map(t=>`<div class="prize ${t.cls}"><div class="pmedal">${t.medal}</div><div class="pinfo"><div class="pplace">${t.place}</div><div class="pwin">${t.n}× SWISS Schoki</div></div><div class="pcount">${"🍫".repeat(t.n)}</div></div>`).join("")}
    <div class="hint" style="text-align:center;margin-top:14px">Predict well. Eat chocolate. Simple. 😋</div>`;
}

function renderAdmin(){
  if(!adminOK) return `<div class="panel"><h3>Control Tower</h3><div class="field"><label>Access code</label><input id="apw" type="password" placeholder="Tower password"></div><button class="btn" id="alogin">Enter tower</button></div>`;
  const phases=["Group","Round of 32","Round of 16","Quarter-final","Semi-final","Third place","Final"];
  const mlist=matches.map(m=>`<div class="adminmatch" data-am="${m.id}">
      <span class="nm">${flagHTML(m.home)} ${esc(m.home)} – ${esc(m.away)} ${flagHTML(m.away)} <span style="color:var(--mut)">(${esc(m.match_date)})</span></span>
      <input type="number" min="0" data-side="hs" value="${m.home_score??""}" placeholder="–"><span style="color:var(--mut)">:</span><input type="number" min="0" data-side="as" value="${m.away_score??""}" placeholder="–">
      <button class="btn sm ghost" data-lock="${m.id}">${m.locked?"🔒":"🔓"}</button>
      <button class="btn sm ${m.finished?"ghost":""}" data-fin="${m.id}">${m.finished?"scored ✓":"score"}</button>
      <button class="btn ghost sm" data-del="${m.id}">✕</button></div>`).join("");
  const bqlist=bonusQs.map(q=>{
    let setter;
    if(q.qtype==="choice"){
      const opts=(()=>{try{return JSON.parse(q.options||"[]")}catch(e){return[]}})();
      setter=`<select data-bc="${q.id}"><option value="">– correct –</option>${opts.map(o=>`<option ${q.correct===o?"selected":""}>${esc(o)}</option>`).join("")}</select>`;
    } else {
      setter=`<input type="${q.qtype==="number"?"number":"text"}" data-bc="${q.id}" value="${esc(q.correct??"")}" placeholder="correct answer" style="width:auto;flex:1;min-width:110px;text-align:left">`;
    }
    return `<div class="adminbq" data-aq="${q.id}"><div class="qx">${esc(q.question)} <span class="tag">${q.qtype}</span><span class="tag">${q.points} pts</span></div>
      <div class="ctrl">${setter}<button class="btn sm ghost" data-block="${q.id}">${q.locked?"🔒":"🔓"}</button><button class="btn sm ${q.resolved?"ghost":""}" data-bres="${q.id}">${q.resolved?"resolved ✓":"resolve"}</button><button class="btn ghost sm" data-bdel="${q.id}">✕</button></div></div>`;
  }).join("");

  return `
    <div class="panel"><h3>Add match</h3>
      <div class="grid2">
        <div class="field"><label>Home</label><input id="nh" placeholder="e.g. Switzerland"></div>
        <div class="field"><label>Away</label><input id="na" placeholder="e.g. Qatar"></div>
        <div class="field"><label>Date</label><input id="nd" placeholder="Sat 13 Jun"></div>
        <div class="field"><label>Time</label><input id="nt" placeholder="21:00"></div>
        <div class="field"><label>Phase</label><select id="np">${phases.map(p=>`<option>${p}</option>`).join("")}</select></div>
        <div class="field"><label>Group (group stage only)</label><input id="ng" placeholder="A" maxlength="2"></div>
      </div><button class="btn" id="addMatch">Add match</button>
      <div class="hint" style="margin-top:8px">Tip: type the country in English or German — flags are detected automatically.</div></div>

    <div class="panel"><h3>Flight control</h3>${mlist||'<div class="hint">No matches.</div>'}
      <div class="hint" style="margin-top:12px">Gate closed blocks predictions before kickoff. Mark scored once the official final score is confirmed.</div></div>

    <div class="panel"><h3>Add bonus question</h3>
      <div class="field"><label>Question</label><input id="bq" placeholder="e.g. Who will win the World Cup?"></div>
      <div class="grid2">
        <div class="field"><label>Type</label><select id="bt"><option value="text">Free text</option><option value="number">Number (closest wins)</option><option value="choice">Multiple choice</option></select></div>
        <div class="field"><label>Points</label><input id="bp" type="number" value="5"></div>
      </div>
      <div class="field"><label>Options (choice only, comma-separated)</label><input id="bo" placeholder="Yes, No"></div>
      <button class="btn" id="addBonus">Add bonus question</button>
      <div class="hint" style="margin-top:8px">Enter the correct answer below once it's known, then hit "resolve" to award points.</div></div>

    <div class="panel"><h3>Bonus questions</h3>${bqlist||'<div class="hint">No bonus questions yet.</div>'}</div>

    <div class="panel"><h3>Scoring (summary)</h3><div class="rules">
      Group stage (points add up): <b>${SCORE.group.tendency}</b> outcome · <b>${SCORE.group.home}</b> home goals · <b>${SCORE.group.away}</b> away goals · <b>${SCORE.group.diff}</b> goal diff (max ${maxPts({phase:"Group"})}).<br>
      Knockout: <b>${SCORE.knockout.tendency}</b> / <b>${SCORE.knockout.home}</b> / <b>${SCORE.knockout.away}</b> / <b>${SCORE.knockout.diff}</b> (max ${maxPts({phase:"Final"})}).<br>
      Full rules are on the <b>Rules</b> tab.</div></div>`;
}

function renderView(){
  const v=$("#view");
  v.innerHTML = tab==="tip"?renderTip() : tab==="bonus"?renderBonus() : tab==="rank"?renderRank() : tab==="prizes"?renderPrizes() : tab==="rules"?renderRules() : renderAdmin();
  bind();
}

function bind(){
  if(tab==="tip"){
    const s=$("#saveTips");
    if(s)s.onclick=saveTips;
    document.querySelectorAll("[data-rnd]").forEach(btn=>btn.onclick=()=>{tipRound=btn.dataset.rnd;renderView();});
  }
  if(tab==="bonus"){
    const s=$("#saveBonus");
    if(s)s.onclick=saveBonus;
  }
  if(tab==="admin"&&!adminOK){
    const b=$("#alogin");
    if(b){
      b.onclick=()=>{if($("#apw").value===ADMIN_PW){adminOK=true;renderView();}else toast("Wrong password");};
      $("#apw").onkeydown=e=>{if(e.key==="Enter")b.click();};
    }
  }
  if(tab==="admin"&&adminOK){
    const opsBtn=$("#saveOpsNews");
    if(opsBtn) opsBtn.onclick=()=>{
      opsNewsMode=$("#opsMode").value;
      opsNewsPreset=$("#opsPreset").value.trim();
      opsNewsCustom=$("#opsCustom").value.trim();
      try{
        localStorage.setItem("ops_news_mode",opsNewsMode);
        localStorage.setItem("ops_news_preset",opsNewsPreset);
        localStorage.setItem("ops_news_custom",opsNewsCustom);
      }catch(e){}
      toast("OPS news saved");
      if(tab==="admin") renderView();
    };

    $("#addMatch").onclick=async()=>{
      const h=$("#nh").value.trim(),a=$("#na").value.trim();
      if(!h||!a){toast("Enter home and away");return;}
      const order=(matches.reduce((mx,x)=>Math.max(mx,x.sort_order||0),0))+1;
      const {error}=await sb.from("matches").insert([{phase:$("#np").value,grp:$("#ng").value.trim()||null,match_date:$("#nd").value.trim()||"TBD",match_time:$("#nt").value.trim()||"—",home:h,away:a,sort_order:order}]);
      if(error){toast("Error");return;}
      await loadAll();toast("Match added");
    };
    document.querySelectorAll('[data-fin]').forEach(btn=>btn.onclick=async()=>{
      const id=+btn.dataset.fin,row=btn.closest('[data-am]'),m=matches.find(x=>x.id===id);
      if(!m.finished){
        const hs=row.querySelector('[data-side=hs]').value,as=row.querySelector('[data-side=as]').value;
        if(hs===""||as===""){toast("Enter the result");return;}
        await sb.from("matches").update({home_score:+hs,away_score:+as,finished:true,locked:true}).eq("id",id);
      } else {
        await sb.from("matches").update({finished:false}).eq("id",id);
      }
      await loadAll();
    });
    document.querySelectorAll('[data-lock]').forEach(btn=>btn.onclick=async()=>{
      const id=+btn.dataset.lock,m=matches.find(x=>x.id===id);
      await sb.from("matches").update({locked:!m.locked}).eq("id",id);
      await loadAll();
    });
    document.querySelectorAll('[data-del]').forEach(btn=>btn.onclick=async()=>{
      if(!confirm("Delete match?"))return;
      await sb.from("matches").delete().eq("id",+btn.dataset.del);
      await loadAll();
    });
    const ab=$("#addBonus");
    if(ab)ab.onclick=async()=>{
      const q=$("#bq").value.trim();
      if(!q){toast("Enter a question");return;}
      const type=$("#bt").value;
      const pts=+$("#bp").value||5;
      let options=null;
      if(type==="choice"){
        const arr=$("#bo").value.split(",").map(s=>s.trim()).filter(Boolean);
        if(arr.length<2){toast("Choice needs ≥2 options");return;}
        options=JSON.stringify(arr);
      }
      const order=(bonusQs.reduce((mx,x)=>Math.max(mx,x.sort_order||0),0))+1;
      const {error}=await sb.from("bonus_questions").insert([{question:q,qtype:type,options,points:pts,sort_order:order}]);
      if(error){toast("Error");return;}
      await loadAll();toast("Bonus question added");
    };
    document.querySelectorAll('[data-bres]').forEach(btn=>btn.onclick=async()=>{
      const id=+btn.dataset.bres,q=bonusQs.find(x=>x.id===id),row=btn.closest('[data-aq]');
      if(!q.resolved){
        const v=String(row.querySelector('[data-bc]').value).trim();
        if(v===""){toast("Enter the correct answer");return;}
        await sb.from("bonus_questions").update({correct:v,resolved:true,locked:true}).eq("id",id);
      } else {
        await sb.from("bonus_questions").update({resolved:false}).eq("id",id);
      }
      await loadAll();
    });
    document.querySelectorAll('[data-block]').forEach(btn=>btn.onclick=async()=>{
      const id=+btn.dataset.block,q=bonusQs.find(x=>x.id===id);
      await sb.from("bonus_questions").update({locked:!q.locked}).eq("id",id);
      await loadAll();
    });
    document.querySelectorAll('[data-bdel]').forEach(btn=>btn.onclick=async()=>{
      if(!confirm("Delete bonus question?"))return;
      await sb.from("bonus_questions").delete().eq("id",+btn.dataset.bdel);
      await loadAll();
    });
  }
}

document.querySelectorAll('nav button').forEach(b=>b.onclick=async()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  tab=b.dataset.tab;
  if(tab!=="admin") await loadAll(); else renderView();
});

loadAll();
</script>
</body>
</html>
