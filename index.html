<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WM 2026 Tippspiel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#d40028;--red-d:#a8001f;--ink:#15171c;--mut:#6b7280;
    --line:#e7e8ec;--bg:#f4f5f7;--card:#fff;--gold:#e9b007;--green:#1a9d52;
    --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"DM Sans",-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .num{font-variant-numeric:tabular-nums}
  header{background:var(--red);color:#fff;padding:18px 16px 0}
  .wrap{max-width:680px;margin:0 auto}
  .brand{display:flex;align-items:baseline;gap:10px}
  .brand b{font-family:"Anton",sans-serif;font-weight:400;font-size:30px;letter-spacing:.5px;line-height:1}
  .brand span{font-size:13px;opacity:.85;font-weight:500}
  .teamname{margin:6px 0 14px;font-size:14px;opacity:.95}
  nav{display:flex;gap:2px;max-width:680px;margin:0 auto}
  nav button{flex:1;background:none;border:0;color:rgba(255,255,255,.75);
    font:inherit;font-weight:700;font-size:14px;padding:12px 0;cursor:pointer;border-bottom:3px solid transparent}
  nav button.on{color:#fff;border-bottom-color:#fff}
  main{max-width:680px;margin:0 auto;padding:16px 16px 60px}
  .me{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:16px;box-shadow:var(--shadow)}
  .me label{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
  .me .row{display:flex;gap:8px;margin-top:8px;align-items:center}
  input,select{font:inherit}
  .me input[type=text]{flex:1;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:15px}
  .me .who{font-size:15px}.me .who b{color:var(--red)}
  .btn{background:var(--red);color:#fff;border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:700;font-size:14px;cursor:pointer}
  .btn:hover{background:var(--red-d)}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn.sm{padding:7px 12px;font-size:13px}
  .day{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;margin:18px 4px 8px}
  .match{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
  .match .meta{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin-bottom:8px;font-weight:500}
  .match .grp{background:var(--bg);border-radius:5px;padding:1px 7px;font-weight:700}
  .teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
  .team{display:flex;align-items:center;gap:8px;min-width:0}
  .team.away{flex-direction:row-reverse;text-align:right}
  .flag{font-size:22px;line-height:1}
  .tname{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .score{display:flex;align-items:center;gap:6px}
  .score input{width:42px;height:42px;text-align:center;font-size:18px;font-weight:700;border:1.5px solid var(--line);border-radius:9px;-moz-appearance:textfield}
  .score input::-webkit-outer-spin-button,.score input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .score input:focus{outline:none;border-color:var(--red)}
  .score input:disabled{background:var(--bg);color:var(--mut)}
  .result{display:flex;flex-direction:column;align-items:center;gap:2px}
  .result .final{font-size:20px;font-weight:800}
  .result .lbl{font-size:9px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
  .pts{margin-top:8px;font-size:13px;display:flex;justify-content:space-between;align-items:center;border-top:1px dashed var(--line);padding-top:8px;color:var(--mut)}
  .pts b{color:var(--ink)}
  .badge{background:var(--green);color:#fff;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:700}
  .badge.zero{background:#e7e8ec;color:var(--mut)}
  .locked{font-size:11px;color:var(--mut);font-style:italic}
  table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
  th,td{padding:13px 14px;text-align:left;font-size:15px;border-bottom:1px solid var(--line)}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);background:#fafbfc}
  tr:last-child td{border-bottom:0}
  td.r{text-align:right}
  .rank{font-weight:800;width:38px}
  .rank.p1{color:var(--gold)}.rank.p2{color:#9aa0a6}.rank.p3{color:#b87333}
  .ptsbig{font-weight:800;font-size:17px}
  .me-row{background:#fff5f6}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:var(--shadow)}
  .panel h3{margin:0 0 12px;font-size:15px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .field{margin-bottom:8px}
  .field label{display:block;font-size:11px;font-weight:700;color:var(--mut);margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px}
  .field input,.field select{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:14px}
  .rules{font-size:13px;line-height:1.7;color:var(--mut)}.rules b{color:var(--ink)}
  .adminmatch{display:flex;align-items:center;gap:6px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;flex-wrap:wrap}
  .adminmatch .nm{flex:1;min-width:160px}
  .adminmatch input{width:38px;text-align:center;border:1px solid var(--line);border-radius:6px;padding:6px 0;font-size:14px;font-weight:700}
  .empty{text-align:center;color:var(--mut);padding:40px 16px;font-size:14px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:30px;font-size:14px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.25);opacity:0;transition:.25s;pointer-events:none;z-index:99}
  .toast.show{opacity:1;bottom:30px}
  .hint{font-size:12px;color:var(--mut);margin:4px 4px 14px;line-height:1.5}
  .loading{text-align:center;padding:50px;color:var(--mut)}
</style>
</head>
<body>

<!-- ============================================================ -->
<!--  HIER DEINE SUPABASE-DATEN EINTRAGEN (siehe README, Schritt 3) -->
<!-- ============================================================ -->
<script>
  const SUPABASE_URL  = "https://dgjfydzjgokzigklgchj.supabase.co";
  const SUPABASE_KEY  = "sb_publishable_mRkwbCEvlRcQL8wk3YSJ4g_6ceY3yUz";
  const ADMIN_PW      = "WM2026";                       // Admin-Passwort (frei änderbar)
  const TEAM_TITEL    = "OPSD Tippspiel";               // Name eurer Tippgruppe
  const PUNKTE        = { exact:5, diff:3, tendency:2 };// Punkte-Regeln
</script>
<!-- ============================================================ -->

<header>
  <div class="wrap">
    <div class="brand"><b>TIPPSPIEL</b><span>FIFA WM 2026 ⚽</span></div>
    <div class="teamname" id="teamTitle"></div>
  </div>
  <nav>
    <button data-tab="tip" class="on">Tippen</button>
    <button data-tab="rank">Rangliste</button>
    <button data-tab="admin">Admin</button>
  </nav>
</header>

<main>
  <div id="meBar" class="me"></div>
  <div id="view"><div class="loading">Lädt …</div></div>
</main>
<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ---------- Setup ---------- */
const FLAGS={"Mexiko":"🇲🇽","Südafrika":"🇿🇦","Brasilien":"🇧🇷","Marokko":"🇲🇦","Niederlande":"🇳🇱","Japan":"🇯🇵","Katar":"🇶🇦","Schweiz":"🇨🇭","Kanada":"🇨🇦","USA":"🇺🇸","Deutschland":"🇩🇪","Frankreich":"🇫🇷","Spanien":"🇪🇸","England":"🏴","Argentinien":"🇦🇷","Portugal":"🇵🇹","Belgien":"🇧🇪","Kroatien":"🇭🇷","Italien":"🇮🇹","Südkorea":"🇰🇷","Ecuador":"🇪🇨","Curaçao":"🇨🇼","Elfenbeinküste":"🇨🇮","Norwegen":"🇳🇴","Senegal":"🇸🇳","Tschechien":"🇨🇿","Bosnien-Herzegowina":"🇧🇦","Paraguay":"🇵🇾","Uruguay":"🇺🇾","Kolumbien":"🇨🇴","Österreich":"🇦🇹"};
const flag=t=>FLAGS[t]||"🏳️";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1900);};

const sb = (window.supabase && SUPABASE_URL.startsWith("http"))
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

let me = localStorage.getItem("wm_me") || "";
let matches = [], tips = [], tab = "tip", adminOK = false;

$("#teamTitle").textContent = TEAM_TITEL;

/* ---------- Daten laden ---------- */
async function loadAll(){
  if(!sb){ $("#view").innerHTML=`<div class="empty">⚠️ Supabase ist noch nicht konfiguriert.<br>Trage oben im Code <b>SUPABASE_URL</b> und <b>SUPABASE_KEY</b> ein (siehe README).</div>`; renderMe(); return; }
  const [m,t] = await Promise.all([
    sb.from("matches").select("*").order("sort_order",{ascending:true}).order("id",{ascending:true}),
    sb.from("tips").select("*")
  ]);
  if(m.error||t.error){ $("#view").innerHTML=`<div class="empty">Fehler beim Laden. Stimmen URL/Key und ist das SQL-Setup ausgeführt?</div>`; return; }
  matches = m.data||[]; tips = t.data||[];
  renderMe(); renderView();
}

/* ---------- Punkte ---------- */
function scoreOf(pick,m){
  if(!pick||!m.finished||m.home_score==null||m.away_score==null) return null;
  const ph=+pick.home_tip,pa=+pick.away_tip,rh=+m.home_score,ra=+m.away_score;
  if(ph===rh&&pa===ra) return PUNKTE.exact;
  if(ph-pa===rh-ra) return PUNKTE.diff;
  if(Math.sign(ph-pa)===Math.sign(rh-ra)) return PUNKTE.tendency;
  return 0;
}
function myPick(matchId){ return tips.find(x=>x.player===me && x.match_id===matchId); }
function totals(){
  const byP={};
  tips.forEach(t=>{ (byP[t.player]=byP[t.player]||[]).push(t); });
  return Object.entries(byP).map(([name,ts])=>{
    let pts=0,exact=0;
    ts.forEach(t=>{ const m=matches.find(x=>x.id===t.match_id); const s=scoreOf(t,m); if(s!=null){pts+=s; if(s===PUNKTE.exact)exact++;} });
    return {name,pts,exact};
  }).sort((a,b)=> b.pts-a.pts || b.exact-a.exact || a.name.localeCompare(b.name));
}

/* ---------- Identität ---------- */
function renderMe(){
  const bar=$("#meBar");
  if(!me){
    bar.innerHTML=`<label>Wer bist du?</label>
      <div class="row"><input id="nameIn" type="text" placeholder="Dein Name" maxlength="24"><button class="btn" id="setName">Los</button></div>
      <div class="hint" style="margin:8px 0 0">Mit deinem Namen erscheinst du in der Rangliste. Tippe ihn immer gleich.</div>`;
    $("#setName").onclick=()=>{const v=$("#nameIn").value.trim();if(!v)return;me=v;localStorage.setItem("wm_me",me);renderMe();renderView();};
    $("#nameIn").onkeydown=e=>{if(e.key==="Enter")$("#setName").click();};
  }else{
    bar.innerHTML=`<div class="row" style="justify-content:space-between;margin:0">
      <div class="who">Angemeldet als <b>${esc(me)}</b></div>
      <button class="btn ghost sm" id="logout">wechseln</button></div>`;
    $("#logout").onclick=()=>{me="";localStorage.removeItem("wm_me");renderMe();renderView();};
  }
}

/* ---------- Tippen ---------- */
function matchCard(m){
  const pick=myPick(m.id)||{};
  if(m.finished){
    const s=scoreOf(pick,m); const has=pick.home_tip!=null;
    return `<div class="match">
      <div class="meta"><span class="grp">${m.phase==="Gruppe"?("Gruppe "+(m.grp||"")):esc(m.phase)}</span><span>${esc(m.match_date)} · ${esc(m.match_time)}</span></div>
      <div class="teams">
        <div class="team"><span class="flag">${flag(m.home)}</span><span class="tname">${esc(m.home)}</span></div>
        <div class="result"><span class="lbl">Endstand</span><span class="final num">${m.home_score}:${m.away_score}</span></div>
        <div class="team away"><span class="flag">${flag(m.away)}</span><span class="tname">${esc(m.away)}</span></div>
      </div>
      <div class="pts"><span>Dein Tipp: <b class="num">${has?pick.home_tip+":"+pick.away_tip:"—"}</b></span>
        ${has?`<span class="badge ${s===0?"zero":""}">${s} Pkt</span>`:`<span class="locked">nicht getippt</span>`}</div></div>`;
  }
  const dis=m.locked?"disabled":"";
  return `<div class="match" data-m="${m.id}">
    <div class="meta"><span class="grp">${m.phase==="Gruppe"?("Gruppe "+(m.grp||"")):esc(m.phase)}</span><span>${esc(m.match_date)} · ${esc(m.match_time)}${m.locked?" · 🔒 geschlossen":""}</span></div>
    <div class="teams">
      <div class="team"><span class="flag">${flag(m.home)}</span><span class="tname">${esc(m.home)}</span></div>
      <div class="score">
        <input type="number" min="0" max="99" class="num" data-side="h" value="${pick.home_tip??""}" ${dis}>
        <span class="sep">:</span>
        <input type="number" min="0" max="99" class="num" data-side="a" value="${pick.away_tip??""}" ${dis}>
      </div>
      <div class="team away"><span class="flag">${flag(m.away)}</span><span class="tname">${esc(m.away)}</span></div>
    </div></div>`;
}
function renderTip(){
  if(!matches.length) return `<div class="empty">Noch keine Spiele angelegt. Lege sie im Tab <b>Admin</b> an.</div>`;
  if(!me) return `<div class="hint" style="text-align:center;margin-top:20px">Gib oben deinen Namen ein, um zu tippen.</div>`;
  let html="",last="";
  matches.forEach(m=>{ if(m.match_date!==last){html+=`<div class="day">${esc(m.match_date)}</div>`;last=m.match_date;} html+=matchCard(m); });
  if(matches.some(m=>!m.finished&&!m.locked)) html+=`<button class="btn" id="saveTips" style="width:100%;padding:14px;margin-top:8px">Tipps speichern</button>`;
  return html;
}
async function saveTips(){
  const rows=[];
  document.querySelectorAll('.match[data-m]').forEach(card=>{
    const id=+card.dataset.m;
    const h=card.querySelector('[data-side=h]').value, a=card.querySelector('[data-side=a]').value;
    if(h!==""&&a!=="") rows.push({player:me, match_id:id, home_tip:+h, away_tip:+a});
  });
  if(!rows.length){toast("Keine Tipps eingegeben");return;}
  const {error}=await sb.from("tips").upsert(rows,{onConflict:"player,match_id"});
  if(error){toast("Fehler beim Speichern");return;}
  await loadAll(); toast("Tipps gespeichert ✓");
}

/* ---------- Rangliste ---------- */
function renderRank(){
  const t=totals();
  if(!t.length) return `<div class="empty">Noch keine Tipps abgegeben.</div>`;
  const any=matches.some(m=>m.finished);
  const rows=t.map((p,i)=>{const r=i+1,c=r<=3?"p"+r:"";
    return `<tr class="${p.name===me?"me-row":""}"><td class="rank ${c}">${r}</td>
      <td>${esc(p.name)}${p.name===me?" <span style='color:var(--red);font-size:12px'>(du)</span>":""}</td>
      <td class="r num">${p.exact}</td><td class="r"><span class="ptsbig num">${p.pts}</span></td></tr>`;}).join("");
  return `${any?"":`<div class="hint">Die Rangliste füllt sich, sobald gewertete Spiele vorliegen.</div>`}
    <table><thead><tr><th>#</th><th>Name</th><th class="r">Volltreffer</th><th class="r">Punkte</th></tr></thead><tbody>${rows}</tbody></table>`;
}

/* ---------- Admin ---------- */
function renderAdmin(){
  if(!adminOK) return `<div class="panel"><h3>Admin-Bereich</h3>
    <div class="field"><label>Passwort</label><input id="apw" type="password" placeholder="Passwort"></div>
    <button class="btn" id="alogin">Anmelden</button></div>`;
  const phases=["Gruppe","Sechzehntelfinale","Achtelfinale","Viertelfinale","Halbfinale","Spiel um Platz 3","Final"];
  const list=matches.map(m=>`<div class="adminmatch" data-am="${m.id}">
      <span class="nm">${flag(m.home)} ${esc(m.home)} – ${esc(m.away)} ${flag(m.away)} <span style="color:var(--mut)">(${esc(m.match_date)})</span></span>
      <input type="number" min="0" data-side="hs" value="${m.home_score??""}" placeholder="–">
      <span style="color:var(--mut)">:</span>
      <input type="number" min="0" data-side="as" value="${m.away_score??""}" placeholder="–">
      <button class="btn sm ghost" data-lock="${m.id}">${m.locked?"🔒 zu":"🔓 offen"}</button>
      <button class="btn sm ${m.finished?"ghost":""}" data-fin="${m.id}">${m.finished?"gewertet ✓":"werten"}</button>
      <button class="btn ghost sm" data-del="${m.id}">✕</button></div>`).join("");
  return `
    <div class="panel"><h3>Spiel hinzufügen</h3>
      <div class="grid2">
        <div class="field"><label>Heim</label><input id="nh" placeholder="z.B. Schweiz"></div>
        <div class="field"><label>Gast</label><input id="na" placeholder="z.B. Katar"></div>
        <div class="field"><label>Datum</label><input id="nd" placeholder="Sa 13.06."></div>
        <div class="field"><label>Zeit</label><input id="nt" placeholder="21:00"></div>
        <div class="field"><label>Phase</label><select id="np">${phases.map(p=>`<option>${p}</option>`).join("")}</select></div>
        <div class="field"><label>Gruppe (nur Gruppenphase)</label><input id="ng" placeholder="A" maxlength="2"></div>
      </div>
      <button class="btn" id="addMatch">Hinzufügen</button></div>
    <div class="panel"><h3>Resultate & Steuerung</h3>
      ${list||'<div class="hint">Keine Spiele.</div>'}
      <div class="hint" style="margin-top:12px">🔒 schliesst das Tippen vor Anpfiff. „werten" zählt das Spiel für die Rangliste (Resultat vorher eintragen).</div></div>
    <div class="panel"><h3>Punkte-Regeln</h3><div class="rules">
      <b>${PUNKTE.exact} Punkte</b> – exaktes Resultat<br>
      <b>${PUNKTE.diff} Punkte</b> – richtige Tordifferenz<br>
      <b>${PUNKTE.tendency} Punkte</b> – richtige Tendenz<br>
      <b>0 Punkte</b> – falsch</div></div>`;
}

/* ---------- Render-Router ---------- */
function renderView(){
  const v=$("#view");
  v.innerHTML = tab==="tip"?renderTip() : tab==="rank"?renderRank() : renderAdmin();
  bind();
}
function bind(){
  if(tab==="tip"){ const s=$("#saveTips"); if(s)s.onclick=saveTips; }
  if(tab==="admin"&&!adminOK){
    const b=$("#alogin"); if(b){b.onclick=()=>{ if($("#apw").value===ADMIN_PW){adminOK=true;renderView();}else toast("Falsches Passwort"); };
      $("#apw").onkeydown=e=>{if(e.key==="Enter")b.click();}; }
  }
  if(tab==="admin"&&adminOK){
    $("#addMatch").onclick=async()=>{
      const h=$("#nh").value.trim(),a=$("#na").value.trim();
      if(!h||!a){toast("Heim und Gast angeben");return;}
      const order=(matches.reduce((mx,x)=>Math.max(mx,x.sort_order||0),0))+1;
      const {error}=await sb.from("matches").insert([{phase:$("#np").value,grp:$("#ng").value.trim()||null,match_date:$("#nd").value.trim()||"TBD",match_time:$("#nt").value.trim()||"—",home:h,away:a,sort_order:order}]);
      if(error){toast("Fehler");return;}
      await loadAll(); toast("Spiel hinzugefügt");
    };
    document.querySelectorAll('[data-fin]').forEach(btn=>btn.onclick=async()=>{
      const id=+btn.dataset.fin,row=btn.closest('[data-am]');
      const m=matches.find(x=>x.id===id);
      if(!m.finished){
        const hs=row.querySelector('[data-side=hs]').value, as=row.querySelector('[data-side=as]').value;
        if(hs===""||as===""){toast("Resultat eintragen");return;}
        await sb.from("matches").update({home_score:+hs,away_score:+as,finished:true,locked:true}).eq("id",id);
      }else{
        await sb.from("matches").update({finished:false}).eq("id",id);
      }
      await loadAll();
    });
    document.querySelectorAll('[data-lock]').forEach(btn=>btn.onclick=async()=>{
      const id=+btn.dataset.lock,m=matches.find(x=>x.id===id);
      await sb.from("matches").update({locked:!m.locked}).eq("id",id); await loadAll();
    });
    document.querySelectorAll('[data-del]').forEach(btn=>btn.onclick=async()=>{
      if(!confirm("Spiel löschen?"))return;
      await sb.from("matches").delete().eq("id",+btn.dataset.del); await loadAll();
    });
  }
}

document.querySelectorAll('nav button').forEach(b=>b.onclick=async()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); tab=b.dataset.tab;
  if(tab!=="admin") await loadAll(); else renderView();
});

/* ---------- Start ---------- */
loadAll();
</script>
</body>
</html>
